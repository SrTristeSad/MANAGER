name: Temporary Telegram Auth Bootstrap

on:
  push:
    branches:
      - feature/0.9.0-telegram-initdata-auth
    paths:
      - tools/tmp_telegram_auth_patch.py
      - .github/workflows/telegram-auth-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.9.0-telegram-initdata-auth
          fetch-depth: 0

      - name: Apply deterministic patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/tmp_telegram_auth_patch.py
          bash -n manager
          bash -n install.sh
          bash -n modules/telegram_auth.sh
          git diff --check

      - name: Commit product changes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager install.sh docs/TELEGRAM.md docs/ROADMAP.md
          git diff --cached --quiet && exit 0
          git commit -m 'feat: integrate Telegram initData authentication'
          git push origin HEAD:feature/0.9.0-telegram-initdata-auth
