name: Migration Archive Preflight
on:
  push:
    paths:
      - 'tools/migration_preflight.py'
      - 'tools/migration_conflicts.py'
      - 'tools/migration_plan.py'
      - 'tools/migration_approval.py'
      - 'install.sh'
      - '.github/scripts/migration-preflight-test.py'
      - '.github/scripts/migration-conflicts-test.py'
      - '.github/scripts/migration-plan-test.py'
      - '.github/scripts/migration-approval-test.py'
      - '.github/workflows/migration-preflight.yml'
  pull_request:
    paths:
      - 'tools/migration_preflight.py'
      - 'tools/migration_conflicts.py'
      - 'tools/migration_plan.py'
      - 'tools/migration_approval.py'
      - 'install.sh'
      - '.github/scripts/migration-preflight-test.py'
      - '.github/scripts/migration-conflicts-test.py'
      - '.github/scripts/migration-plan-test.py'
      - '.github/scripts/migration-approval-test.py'
      - '.github/workflows/migration-preflight.yml'
jobs:
  archive-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test migration preflight
        run: |
          python3 -m py_compile tools/migration_preflight.py
          python3 .github/scripts/migration-preflight-test.py
          python3 -m py_compile tools/migration_conflicts.py
          python3 .github/scripts/migration-conflicts-test.py
          python3 -m py_compile tools/migration_plan.py
          python3 .github/scripts/migration-plan-test.py
          python3 -m py_compile tools/migration_approval.py
          python3 .github/scripts/migration-approval-test.py
          python3 - <<'PY'
          from pathlib import Path
          script = Path('install.sh').read_text()
          for name in ('migration_preflight.py','migration_conflicts.py','migration_plan.py','migration_approval.py'):
              assert f'"tools/{name}"' in script
          assert '"$STAGE"/tools/*.py' in script
          assert '"$TMP"/tools/*.py' in script
          PY
