name: Finalize 0.7.0 release docs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-070-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Finalize changelog and roadmap
        run: python3 scripts/finalize_release_070.py

      - name: Commit release docs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md docs/ROADMAP.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md docs/ROADMAP.md
          git commit -m 'docs: finalize 0.7.0 release notes'
          git push origin HEAD:main
