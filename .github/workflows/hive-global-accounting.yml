name: Hive Global Accounting and Quotas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hive-global-accounting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install current MANAGER tree
        shell: bash
        run: |
          set -euxo pipefail
          sudo env MANAGER_ALLOW_FILE_SOURCE=1 MANAGER_REPO_RAW="file://${GITHUB_WORKSPACE}" bash install.sh
          test "$(sudo cat /opt/manager/VERSION)" = 0.8.8
          sudo test -x /opt/manager/modules/hive_accounting.sh
          sudo manager hive accounting status | grep -q '^contract=manager-hive-global-accounting-v1$'

      - name: Initialize controller, first node and lease control plane
        shell: bash
        run: |
          set -euxo pipefail
          sudo manager hive controller init >/dev/null
          sudo manager hive lease controller init >/dev/null
          sudo manager hive lease controller enable 127.0.0.1 19445 >/dev/null
          lease_fp="$(sudo manager hive lease controller status | awk -F= '$1=="tls_fingerprint"{print $2}')"
          controller_fp="$(sudo manager hive controller fingerprint)"
          printf '%s\n' "$lease_fp" >/tmp/lease.fp
          printf '%s\n' "$controller_fp" >/tmp/controller.fp

          sudo manager hive request /tmp/node1.request.json >/dev/null
          sudo manager hive controller approve /tmp/node1.request.json /tmp/node1.bundle.json >/dev/null
          sudo manager hive accept /tmp/node1.bundle.json "$controller_fp" >/dev/null
          sudo manager hive lease node configure 127.0.0.1 19445 "$lease_fp" 30 >/dev/null
          node="$(sudo manager hive status | awk -F= '$1=="node_id"{print $2}')"
          test -n "$node"
          printf '%s\n' "$node" >/tmp/node1.id

          sudo manager hive node placement "$node" BR-SP-A BR BR-SP PREMIUM >/dev/null
          sudo mkdir -p /etc/manager/hive/controller/health /var/lib/manager/hive-health/nodes
          printf 'version=1\ndegraded_after_seconds=75\noffline_after_seconds=180\n' | sudo tee /etc/manager/hive/controller/health/controller.conf >/dev/null
          now="$(date +%s)"
          sudo python3 - "$now" "$node" <<'PY'
          import json,sys
          now=int(sys.argv[1]); node=sys.argv[2]; conf={}
          for line in open(f'/etc/manager/hive/controller/nodes/{node}.conf'):
              if '=' in line:
                  k,v=line.rstrip().split('=',1); conf[k]=v
          obs={'version':1,'node_id':node,'node_epoch':int(conf['node_epoch']),'issued_at':now,'received_at':now,'source':'ci',
               'base_state':'HEALTHY','base_reason':'ok','metrics':{'sessions':0,'max_sessions':100,'capacity':10,'weight':1,
               'previous_rtt_ms':10,'protocols':['ssh','wireguard','openvpn'],'service_ssh':'active','service_wireguard':'active','service_openvpn':'active'}}
          open(f'/var/lib/manager/hive-health/nodes/{node}.json','w').write(json.dumps(obs,sort_keys=True,separators=(',',':')))
          PY
          sudo chmod 600 /var/lib/manager/hive-health/nodes/*.json

          sudo manager hive accounting enable >/tmp/accounting.enable
          grep -q '^global_accounting=1$' /tmp/accounting.enable
          grep -q '^transport=lease-control-ed25519-tls13$' /tmp/accounting.enable
          sudo systemctl is-enabled --quiet manager-hive-accounting-sync.timer
          sudo systemctl stop manager-hive-accounting-sync.timer manager-hive-accounting-sync.service

      - name: Create a second enrolled node on the same controller
        shell: bash
        run: |
          set -euxo pipefail
          node2_etc=/tmp/manager-node2/etc/manager
          sudo mkdir -p "$node2_etc"
          sudo env MANAGER_ETC="$node2_etc" /opt/manager/modules/hive_identity.sh --install >/dev/null
          sudo env MANAGER_ETC="$node2_etc" /opt/manager/modules/hive_identity.sh --request /tmp/node2.request.json >/dev/null
          sudo manager hive controller approve /tmp/node2.request.json /tmp/node2.bundle.json >/dev/null
          sudo env MANAGER_ETC="$node2_etc" /opt/manager/modules/hive_identity.sh --accept /tmp/node2.bundle.json "$(cat /tmp/controller.fp)" >/dev/null
          sudo env MANAGER_ETC="$node2_etc" MANAGER_HIVE_LEASE_DATA_DIR=/tmp/manager-node2/lease-data \
            /opt/manager/modules/hive_leases.sh --node-configure 127.0.0.1 19445 "$(cat /tmp/lease.fp)" 30 >/dev/null
          node2="$(sudo env MANAGER_ETC="$node2_etc" /opt/manager/modules/hive_identity.sh --status | awk -F= '$1=="node_id"{print $2}')"
          test -n "$node2"
          test "$node2" != "$(cat /tmp/node1.id)"
          printf '%s\n' "$node2" >/tmp/node2.id

      - name: Aggregate cumulative usage idempotently across nodes
        shell: bash
        run: |
          set -euxo pipefail
          sudo manager hive accounting quota set acct PREMIUM 500 lifetime block >/tmp/quota.set
          sudo manager hive lease limit set acct 2 PREMIUM >/tmp/limit.set
          grep -q '^max_sessions_global=2$' /tmp/limit.set

          first="$(sudo /opt/manager/modules/hive_leases.sh --usage-ingest-node acct PREMIUM usage-100 100 50 100 50 0 0 1 1000)"
          grep -q '^baseline=1$' <<<"$first"
          grep -q '^delta_bytes=0$' <<<"$first"
          grep -q '^global_total_bytes=0$' <<<"$first"

          second="$(sudo /opt/manager/modules/hive_leases.sh --usage-ingest-node acct PREMIUM usage-100 300 150 300 150 0 0 1 1001)"
          grep -q '^delta_bytes=300$' <<<"$second"
          grep -q '^global_total_bytes=300$' <<<"$second"

          duplicate="$(sudo /opt/manager/modules/hive_leases.sh --usage-ingest-node acct PREMIUM usage-100 300 150 300 150 0 0 1 1001)"
          grep -q '^delta_bytes=0$' <<<"$duplicate"
          grep -q '^global_total_bytes=300$' <<<"$duplicate"

          if sudo /opt/manager/modules/hive_leases.sh --usage-ingest-node acct PREMIUM usage-100 299 149 299 149 0 0 1 1002 >/tmp/regression.out 2>/tmp/regression.err; then
            echo 'counter regression was incorrectly accepted' >&2
            exit 1
          fi
          grep -q 'usage-counter-regression' /tmp/regression.err

          NODE2_ETC=/tmp/manager-node2/etc/manager
          node2_cmd=(sudo env MANAGER_ETC="$NODE2_ETC" MANAGER_HIVE_LEASE_DATA_DIR=/tmp/manager-node2/lease-data MANAGER_HIVE_ACCOUNTING_DATA_DIR=/tmp/manager-node2/accounting-data /opt/manager/modules/hive_leases.sh)
          n2base="$("${node2_cmd[@]}" --usage-ingest-node acct PREMIUM usage-200 500 500 500 500 0 0 1 2000)"
          grep -q '^baseline=1$' <<<"$n2base"
          grep -q '^global_total_bytes=300$' <<<"$n2base"
          n2delta="$("${node2_cmd[@]}" --usage-ingest-node acct PREMIUM usage-200 700 600 700 600 0 0 1 2001)"
          grep -q '^delta_bytes=300$' <<<"$n2delta"
          grep -q '^global_total_bytes=600$' <<<"$n2delta"
          grep -q '^source_nodes=2$' <<<"$n2delta"

          quota="$(sudo manager hive accounting quota show acct)"
          grep -q '^quota_used_bytes=600$' <<<"$quota"
          grep -q '^quota_exceeded=1$' <<<"$quota"
          grep -q '^quota_enforceable=1$' <<<"$quota"
          limit="$(sudo manager hive lease limit show acct)"
          grep -q '^max_sessions_global=2$' <<<"$limit"

      - name: Fence counter reset without double counting
        shell: bash
        run: |
          set -euxo pipefail
          reset="$(sudo /opt/manager/modules/hive_leases.sh --usage-ingest-node acct PREMIUM usage-101 1000 1000 1000 1000 0 0 1 3000)"
          grep -q '^source_reset=1$' <<<"$reset"
          grep -q '^baseline=1$' <<<"$reset"
          grep -q '^delta_bytes=0$' <<<"$reset"
          grep -q '^global_total_bytes=600$' <<<"$reset"
          after="$(sudo /opt/manager/modules/hive_leases.sh --usage-ingest-node acct PREMIUM usage-101 1100 1200 1100 1200 0 0 1 3001)"
          grep -q '^delta_bytes=300$' <<<"$after"
          grep -q '^global_total_bytes=900$' <<<"$after"

      - name: Block new grants by global quota without changing session authority
        shell: bash
        run: |
          set -euxo pipefail
          if sudo manager hive lease controller grant acct wireguard BR-SP PREMIUM acct '*' quota-device 60 >/tmp/quota-grant.out 2>/tmp/quota-grant.err; then
            echo 'global grant bypassed exceeded block quota' >&2
            exit 1
          fi
          grep -q 'Franquia global excedida' /tmp/quota-grant.err
          sudo manager hive lease limit show acct | grep -q '^max_sessions_global=2$'
          test "$(sudo manager hive lease controller list acct | grep -c '^acct|' || true)" = 0
          sudo grep -q '"event":"quota-deny-grant"' /var/log/manager/hive-accounting-audit.jsonl

      - name: Never block incomplete SSH byte coverage
        shell: bash
        run: |
          set -euxo pipefail
          sudo manager hive accounting quota set acctssh PREMIUM 100 lifetime block >/dev/null
          sudo manager hive lease limit set acctssh 1 PREMIUM >/dev/null
          sudo /opt/manager/modules/hive_leases.sh --usage-ingest-node acctssh PREMIUM usage-ssh 0 0 0 0 0 0 0 4000 >/dev/null
          sudo /opt/manager/modules/hive_leases.sh --usage-ingest-node acctssh PREMIUM usage-ssh 200 0 200 0 0 0 0 4001 >/dev/null
          quota="$(sudo manager hive accounting quota show acctssh)"
          grep -q '^quota_exceeded=1$' <<<"$quota"
          grep -q '^quota_enforceable=0$' <<<"$quota"
          grant="$(sudo manager hive lease controller grant acctssh wireguard BR-SP PREMIUM acctssh '*' ssh-partial-device 60)"
          grep -q '^lease_state=reserved$' <<<"$grant"
          grep -q '^max_sessions_global=1$' <<<"$grant"
          sudo manager hive lease controller revoke acctssh ci-cleanup >/dev/null

      - name: Exercise node sync from local identity accounting
        shell: bash
        run: |
          set -euxo pipefail
          sudo /opt/manager/modules/products.sh --create PREMIUM 'CI Premium' 1 0 2 wireguard 1000 lifetime warn '*' '*' '*' 2>/dev/null || true
          sudo mkdir -p /etc/manager/wireguard/clients
          printf 'client=syncacct\n' | sudo tee /etc/manager/wireguard/clients/syncacct.meta >/dev/null
          printf '[Interface]\nPrivateKey=ci-placeholder\n' | sudo tee /etc/manager/wireguard/clients/syncacct.conf >/dev/null
          sudo chmod 600 /etc/manager/wireguard/clients/syncacct.meta /etc/manager/wireguard/clients/syncacct.conf
          sudo /opt/manager/modules/connection_engine.sh --create syncacct '' 0 2 wireguard >/dev/null
          sudo /opt/manager/modules/connection_engine.sh --bind syncacct wireguard syncacct >/dev/null
          sudo /opt/manager/modules/products.sh --assign syncacct PREMIUM >/dev/null
          sudo /opt/manager/modules/identity_usage.sh --ingest-counter syncacct wireguard syncacct ci-counter 100 100
          sudo /opt/manager/modules/identity_usage.sh --ingest-counter syncacct wireguard syncacct ci-counter 300 500
          sudo manager hive accounting quota set syncacct PREMIUM 1000 lifetime warn >/dev/null
          first="$(sudo manager hive accounting sync syncacct)"
          grep -q '^accounting_synced=1$' <<<"$first"
          show_first="$(sudo manager hive accounting controller show syncacct)"
          grep -q '^total_bytes=0$' <<<"$show_first"
          sudo /opt/manager/modules/identity_usage.sh --ingest-counter syncacct wireguard syncacct ci-counter 400 700
          second="$(sudo manager hive accounting sync syncacct)"
          grep -q '^accounting_synced=1$' <<<"$second"
          show_second="$(sudo manager hive accounting controller show syncacct)"
          grep -q '^total_bytes=300$' <<<"$show_second"

      - name: Preserve accounting state across detach and reinstall
        shell: bash
        run: |
          set -euxo pipefail
          sudo /opt/manager/modules/hive_accounting.sh --detach
          sudo test -f /etc/manager/hive/accounting/node.conf
          sudo test -f /var/lib/manager/hive-accounting/controller/identities/acct.json
          test ! -e /etc/systemd/system/manager-hive-accounting-sync.timer
          sudo /opt/manager/modules/hive_accounting.sh --install
          sudo systemctl is-enabled --quiet manager-hive-accounting-sync.timer
          sudo systemctl is-active --quiet manager-hive-accounting-sync.timer
          sudo systemctl stop manager-hive-accounting-sync.timer manager-hive-accounting-sync.service

      - name: Purge only 0.8.6 accounting state
        shell: bash
        run: |
          set -euxo pipefail
          sudo /opt/manager/modules/hive_accounting.sh --purge
          sudo test ! -e /etc/manager/hive/accounting
          sudo test ! -e /etc/manager/hive/controller/accounting
          sudo test ! -e /var/lib/manager/hive-accounting
          sudo test -f /etc/manager/hive/controller/controller.conf
          sudo test -f /etc/manager/hive/controller/leases/controller.conf
