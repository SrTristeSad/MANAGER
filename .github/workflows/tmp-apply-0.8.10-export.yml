name: Temporary Apply 0.8.10 Structured Export

on:
  push:
    branches:
      - feature/0.8.10-structured-export

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.10-structured-export
      - name: Apply product and documentation changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # modules/hive_observability.sh
          replace_once(
              'modules/hive_observability.sh',
              'CONTRACT = "manager-hive-observability-v1"\nHEALTH_CONTRACT = "manager-hive-health-history-v1"\n',
              'CONTRACT = "manager-hive-observability-v1"\nEXPORT_CONTRACT = "manager-hive-observability-export-v1"\nHEALTH_CONTRACT = "manager-hive-health-history-v1"\n'
          )
          replace_once(
              'modules/hive_observability.sh',
              'DEFAULT_LIMIT = 50\nMAX_LIMIT = 500\nDEFAULT_WINDOW = 3600\n',
              'DEFAULT_LIMIT = 50\nMAX_LIMIT = 500\nMAX_EXPORT_LIMIT = 100\nDEFAULT_WINDOW = 3600\n'
          )
          replace_once(
              'modules/hive_observability.sh',
              'def summary(window):\n',
              'def build_summary(window):\n'
          )
          replace_once(
              'modules/hive_observability.sh',
              '    print(json_line(result))\n\n\ndef status():\n',
              '''    return result\n\n\ndef summary(window):\n    print(json_line(build_summary(window)))\n\n\ndef export_scalar(value):\n    if value is None or isinstance(value, bool):\n        return value\n    if isinstance(value, int):\n        return value\n    if isinstance(value, float):\n        return round(value, 4) if math.isfinite(value) else 0.0\n    if isinstance(value, str):\n        return value[:160]\n    return None\n\n\ndef export_record(obj):\n    out = {}\n    for key, value in obj.items():\n        safe = export_scalar(value)\n        if safe is not None or value is None:\n            out[str(key)[:64]] = safe\n    return out\n\n\ndef export_snapshot(window, limit):\n    now = int(time.time())\n    since = now - window\n    health = [export_record(x) for x in tail_records(HEALTH_HISTORY, limit, since=since)]\n    scheduler = [export_record(x) for x in tail_records_many(\n        audit_source_paths("scheduler"), limit, sanitizer=sanitize_scheduler, since=since\n    )]\n    leases = [export_record(x) for x in tail_records_many(\n        audit_source_paths("leases"), limit, sanitizer=sanitize_lease, since=since\n    )]\n    result = {\n        "contract": EXPORT_CONTRACT,\n        "observability_contract": CONTRACT,\n        "generated_epoch": now,\n        "window_seconds": window,\n        "limit_per_stream": limit,\n        "summary": build_summary(window),\n        "streams": {\n            "health": health,\n            "scheduler": scheduler,\n            "leases": leases,\n        },\n        "security": {\n            "allowlisted_fields_only": 1,\n            "contains_private_keys": 0,\n            "contains_credentials": 0,\n            "contains_raw_audit": 0,\n            "contains_internal_paths": 0,\n            "controller_in_user_vpn_path": 0,\n        },\n    }\n    print(json_line(result))\n\n\ndef status():\n'''
          )
          replace_once(
              'modules/hive_observability.sh',
              'print("Uso: hive_observability.sh --status|--summary [WINDOW]|--health [NODE|*] [LIMIT]|--scheduler [LIMIT]|--leases [IDENTITY|*] [LIMIT]|--prune [SECONDS]|--audit-status|--audit-maintain [RETENTION] [MAX_BYTES] [force]", file=sys.stderr)',
              'print("Uso: hive_observability.sh --status|--summary [WINDOW]|--export [WINDOW] [LIMIT]|--health [NODE|*] [LIMIT]|--scheduler [LIMIT]|--leases [IDENTITY|*] [LIMIT]|--prune [SECONDS]|--audit-status|--audit-maintain [RETENTION] [MAX_BYTES] [force]", file=sys.stderr)'
          )
          replace_once(
              'modules/hive_observability.sh',
              '''elif cmd == "--summary":\n    summary(parse_int(args[1] if len(args) > 1 else DEFAULT_WINDOW, "window_seconds", 60, MAX_RETENTION))\nelif cmd == "--prune":\n''',
              '''elif cmd == "--summary":\n    summary(parse_int(args[1] if len(args) > 1 else DEFAULT_WINDOW, "window_seconds", 60, MAX_RETENTION))\nelif cmd == "--export":\n    if len(args) > 3: usage()\n    export_snapshot(\n        parse_int(args[1] if len(args) > 1 else DEFAULT_WINDOW, "window_seconds", 60, MAX_RETENTION),\n        parse_int(args[2] if len(args) > 2 else DEFAULT_LIMIT, "export_limit", 1, MAX_EXPORT_LIMIT),\n    )\nelif cmd == "--prune":\n'''
          )

          # manager CLI
          replace_once(
              'manager',
              '  manager hive observe summary [WINDOW_SECONDS]\n  manager hive observe health [NODE_ID|*] [LIMIT]\n',
              '  manager hive observe summary [WINDOW_SECONDS]\n  manager hive observe export [WINDOW_SECONDS] [LIMIT]\n  manager hive observe health [NODE_ID|*] [LIMIT]\n'
          )
          replace_once(
              'manager',
              '          summary) exec "$MANAGER_HOME/modules/hive_observability.sh" --summary "${4:-3600}" ;;\n          health)',
              '          summary) exec "$MANAGER_HOME/modules/hive_observability.sh" --summary "${4:-3600}" ;;\n          export) exec "$MANAGER_HOME/modules/hive_observability.sh" --export "${4:-3600}" "${5:-50}" ;;\n          health)'
          )
          replace_once(
              'manager',
              'Uso: manager hive observe {status|summary [WINDOW]|health [NODE|*] [LIMIT]|scheduler [LIMIT]|leases [ID|*] [LIMIT]|prune [SECONDS]|audit-status|audit-maintain [RETENTION] [MAX_BYTES] [force]}',
              'Uso: manager hive observe {status|summary [WINDOW]|export [WINDOW] [LIMIT]|health [NODE|*] [LIMIT]|scheduler [LIMIT]|leases [ID|*] [LIMIT]|prune [SECONDS]|audit-status|audit-maintain [RETENTION] [MAX_BYTES] [force]}'
          )

          # docs
          replace_once(
              'docs/HIVE_OBSERVABILITY.md',
              'manager hive observe summary [WINDOW_SECONDS]\nmanager hive observe health [NODE_ID|*] [LIMIT]\n',
              'manager hive observe summary [WINDOW_SECONDS]\nmanager hive observe export [WINDOW_SECONDS] [LIMIT]\nmanager hive observe health [NODE_ID|*] [LIMIT]\n'
          )
          replace_once(
              'docs/HIVE_OBSERVABILITY.md',
              '- outage, recovery e fencing da autoridade.\n\n## Isolamento de falhas\n',
              '''- outage, recovery e fencing da autoridade.\n\n## Export estruturado\n\n`manager hive observe export [WINDOW_SECONDS] [LIMIT]` produz um único objeto JSON canônico com contrato `manager-hive-observability-export-v1`. Ele foi desenhado para consumidores externos controlados, como Automation v2, Bot/Mini App ou ferramentas administrativas.\n\nO envelope contém `summary` e três streams limitados (`health`, `scheduler`, `leases`). Scheduler e leases continuam passando pelas mesmas allowlists das consultas locais; o export adiciona limite de 160 caracteres por string e aceita no máximo 100 registros por stream. Não são exportados caminhos internos, audit bruto, chave privada, assinatura, nonce, token, senha ou credencial VPN.\n\nO comando continua exigindo root no host. Esta fatia não abre porta HTTP, socket público ou novo listener: autorização remota permanece responsabilidade do canal de automação autenticado.\n\n## Isolamento de falhas\n'''
          )
          replace_once(
              'docs/HIVE_OBSERVABILITY.md',
              'A segunda fatia fecha a retenção/rotação coordenada dos audits de scheduler e leases sem mudar quem escreve ou decide no control plane. A 0.8.10 ainda não está fechada: permanecem export estruturado para integração externa, séries temporais/métricas adicionais e o gate final multi-nó da release.',
              'A terceira fatia adiciona export estruturado, limitado e sanitizado para integração externa sem abrir um novo serviço de rede. A 0.8.10 ainda não está fechada: permanecem séries temporais/métricas operacionais adicionais e o gate final multi-nó da release.'
          )

          replace_once(
              'docs/ROADMAP.md',
              '- retenção temporal remove somente segmentos antigos, com armazenamento root-only e sem compressão concorrente;\n- controlador continua fora do caminho de dados VPN.\n',
              '- retenção temporal remove somente segmentos antigos, com armazenamento root-only e sem compressão concorrente;\n- export JSON versionado, sanitizado e limitado para integração externa, sem listener adicional;\n- controlador continua fora do caminho de dados VPN.\n'
          )
          replace_once(
              'docs/ROADMAP.md',
              '- export estruturado/integração externa;\n',
              ''
          )
          PY

          bash -n manager
          bash -n modules/hive_observability.sh
          python3 - <<'PY'
          from pathlib import Path
          text=Path('modules/hive_observability.sh').read_text()
          body=text.split("python3 - \"$@\" <<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          compile(body, 'hive_observability_embedded.py', 'exec')
          PY
          git diff --check

      - name: Commit applied slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/hive_observability.sh manager docs/HIVE_OBSERVABILITY.md docs/ROADMAP.md
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add structured Hive observability export'
          git push origin HEAD:feature/0.8.10-structured-export
