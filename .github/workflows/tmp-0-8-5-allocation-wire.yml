name: Temporary 0.8.5 Allocation Wiring

on:
  push:
    branches:
      - feature/0.8.5-vpn-allocation-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: simplify temporary 0.8.5 wiring workflow'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.5-vpn-allocation-foundation
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/tmp_patch_085.py
      - name: Validate syntax and commit
        shell: bash
        run: |
          set -euo pipefail
          bash -n manager install.sh uninstall.sh rollback.sh modules/hive_leases.sh modules/protocol_leases.sh modules/hive_allocations.sh
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manager install.sh uninstall.sh rollback.sh modules/hive_leases.sh modules/protocol_leases.sh
          git commit -m 'apply: wire 0.8.5 allocation foundation'
          git push origin HEAD:feature/0.8.5-vpn-allocation-foundation
