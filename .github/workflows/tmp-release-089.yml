name: Temporary apply MANAGER 0.8.9 release

on:
  push:
    branches:
      - release/0.8.9
    paths:
      - .github/workflows/tmp-release-089.yml
      - scripts/tmp_release_089.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.8.9
          fetch-depth: 0

      - name: Apply validated release patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp_release_089.py
          test "$(cat VERSION)" = 0.8.9
          grep -q '^## \[0.8.9\] - 2026-10-14$' CHANGELOG.md
          grep -q '^### 0\.8\.9 — rotação de chaves e anti-replay distribuído ✅$' docs/ROADMAP.md
          git diff --check

      - name: Build release commit object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION README.md CHANGELOG.md docs/ROADMAP.md .github/workflows
          git commit -m 'release: MANAGER 0.8.9'
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:release/0.8.9
