name: Temporary apply MANAGER 0.8.9 release

on:
  push:
    branches: [release/0.8.9]
    paths: [.github/workflows/tmp-release-089.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.8.9
          fetch-depth: 0

      - name: Apply release metadata and gate versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          Path('VERSION').write_text('0.8.9\n')

          p = Path('README.md')
          s = p.read_text()
          old = 'Versão atual: **0.8.8**.'
          if old not in s:
              raise SystemExit('README current-version anchor missing')
          p.write_text(s.replace(old, 'Versão atual: **0.8.9**.', 1))

          p = Path('CHANGELOG.md')
          s = p.read_text()
          marker = '## [0.8.8] - 2026-10-12\n'
          if marker not in s:
              raise SystemExit('CHANGELOG 0.8.8 anchor missing')
          section = '''## [0.8.9] - 2026-10-14

### Colmeia — rotação de chaves e anti-replay distribuído

- Identidades Ed25519 de nó agora possuem rotação explícita: request assinado pela chave atual, prova de posse da nova chave e `node_epoch` incrementado pelo controlador antes do commit local.
- A identidade Ed25519 do controlador usa transição dual-signed (chave antiga + nova), `controller_epoch` monotônico e aceite explícito por cada nó enrolled.
- Requests/transições de rotação usam `rotation_id`, timestamp, nonce, freshness e replay cache persistente; retry idêntico é idempotente e payload divergente é recusado.
- Chaves privadas antigas de nó/controlador não são arquivadas; somente chaves públicas e documentos assinados permanecem para audit/fencing.
- A chave WireGuard da malha `mgh0` ganhou staged rotation: chave privada nova nasce somente no nó em `0600`, o controlador autoriza a transição e a ativação avança `config_epoch`/`network_generation` antes de redistribuir a topologia.
- Commit WireGuard local é transacional: chave e bundle novo entram juntos; falha de aplicação restaura chave/topologia anteriores e permite crash recovery seguro.
- Anti-replay/fencing consolidado cobre `node_epoch`, `controller_epoch`, `config_epoch`, `network_generation`, freshness e nonces entre identidade, topologia, health/leases e control plane.
- O gate final encadeia node-key rotation, re-enrollment da geração atual, WireGuard key rotation e controller-key rotation, comprovando que artefatos das gerações antigas são recusados enquanto retries legítimos permanecem idempotentes.
- Nenhuma criptografia própria foi criada: Ed25519/OpenSSL e WireGuard continuam sendo as primitivas utilizadas.
- O HEAD funcional de fechamento passou **34/34 workflows** antes do bump formal da release.

### Próxima etapa

- 0.8.10: observabilidade distribuída da Colmeia.

'''
          p.write_text(s.replace(marker, section + marker, 1))

          p = Path('docs/ROADMAP.md')
          s = p.read_text()
          pattern = re.compile(r'### 0\.8\.9 — rotação de chaves e anti-replay distribuído\n.*?(?=\n### 0\.8\.10 — observabilidade distribuída)', re.S)
          replacement = '''### 0.8.9 — rotação de chaves e anti-replay distribuído ✅

- rotação Ed25519 explícita da identidade do nó com prova da chave antiga/nova e fencing por `node_epoch`;
- rotação Ed25519 do controlador com transição dual-signed e `controller_epoch` monotônico;
- rotação staged da chave WireGuard da malha `mgh0`, ativação por nova geração de topologia e commit local transacional;
- nonce, timestamp, freshness, replay cache persistente e retries idempotentes nos contratos de rotação;
- fencing consolidado por geração entre identidade, topologia e control plane;
- histórico conserva somente material público/documentos assinados; chaves privadas antigas não são arquivadas;
- nenhuma criptografia própria;
- gate final integrado e regressão funcional completa: **34/34 workflows** verdes antes do bump formal.
'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'ROADMAP 0.8.9 section match count={n}')
          p.write_text(s2)

          workflows = [
              'automation-v2-remote-scopes.yml',
              'hive-global-accounting.yml',
              'hive-operational-resilience.yml',
              'hive-remote-final-e2e.yml',
              'hive-remote-pool-routing.yml',
              'hive-remote-routing.yml',
              'hive-vpn-allocation-distribution.yml',
              'hive-vpn-allocation.yml',
              'hive-vpn-public-login.yml',
              'hive-vpn-remote-provisioning.yml',
              'hive-key-rotation.yml',
              'hive-wg-key-rotation.yml',
              'hive-security-final-gate.yml',
          ]
          root = Path('.github/workflows')
          for name in workflows:
              q = root / name
              text = q.read_text()
              if '0.8.8' not in text:
                  raise SystemExit(f'expected 0.8.8 version assertion missing in {q}')
              q.write_text(text.replace('0.8.8', '0.8.9'))

          release_gate = '''name: Validate MANAGER 0.8.9 Release Metadata

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify 0.8.9 version and release documentation
        shell: bash
        run: |
          set -euxo pipefail
          test "$(cat VERSION)" = "0.8.9"
          grep -q 'Versão atual: \\*\\*0.8.9\\*\\*' README.md
          grep -q '^## \\[0.8.9\\] - 2026-10-14$' CHANGELOG.md
          grep -q '^### 0\\.8\\.9 — rotação de chaves e anti-replay distribuído ✅$' docs/ROADMAP.md
          grep -q '^## 24\\. Rotação de chaves — fundação 0\\.8\\.9$' docs/HIVE.md
          grep -q 'hive_key_rotation.sh' install.sh
          grep -q 'hive_wg_rotation.sh' install.sh
          grep -q '^name: Hive Key Rotation$' .github/workflows/hive-key-rotation.yml
          grep -q '^name: Hive WireGuard Key Rotation$' .github/workflows/hive-wg-key-rotation.yml
          grep -q '^name: Hive Distributed Anti-Replay and Fencing Final Gate$' .github/workflows/hive-security-final-gate.yml

      - name: Keep 0.8.10 outside the 0.8.9 release
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^### 0\\.8\\.10 — observabilidade distribuída$' docs/ROADMAP.md
          ! grep -q '^## \\[0.8.10\\]' CHANGELOG.md
          test "$(cat VERSION)" = "0.8.9"
'''
          (root / '0-8-4-release-docs.yml').write_text(release_gate)

          remaining = []
          for q in root.glob('*.yml'):
              if q.name == 'tmp-release-089.yml':
                  continue
              if '0.8.8' in q.read_text():
                  remaining.append(str(q))
          if remaining:
              raise SystemExit('workflow files still containing 0.8.8: ' + ', '.join(remaining))
          PY

          test "$(cat VERSION)" = 0.8.9
          grep -q '^## \[0.8.9\] - 2026-10-14$' CHANGELOG.md
          grep -q '^### 0\.8\.9 — rotação de chaves e anti-replay distribuído ✅$' docs/ROADMAP.md
          git diff --check

      - name: Build release commit object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION README.md CHANGELOG.md docs/ROADMAP.md .github/workflows
          git commit -m 'release: MANAGER 0.8.9'
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:release/0.8.9
