name: Temporary Telegram Gateway Bootstrap

on:
  push:
    branches:
      - feature/0.9.0-telegram-gateway
    paths:
      - tmp_patch_telegram_gateway.py
      - .github/workflows/tmp-telegram-gateway-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.9.0-telegram-gateway
      - name: Apply integration patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 tmp_patch_telegram_gateway.py
          bash -n manager
          bash -n install.sh
          bash -n modules/telegram_gateway.sh
          git diff --check
      - name: Commit product integration
        shell: bash
        run: |
          set -euxo pipefail
          if git diff --quiet -- manager install.sh docs/TELEGRAM.md docs/ROADMAP.md; then
            echo 'No product changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager install.sh docs/TELEGRAM.md docs/ROADMAP.md
          git commit -m 'feat: integrate Telegram typed gateway'
          git push origin HEAD:feature/0.9.0-telegram-gateway
