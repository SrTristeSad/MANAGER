name: Temporary Apply 0.8.7 Release Docs

on:
  push:
    branches: [release/0.8.7]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.8.7
      - name: Apply release docs
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/tmp_release_087.py
          test "$(cat VERSION)" = 0.8.7
          grep -q 'Versão atual: \*\*0.8.7\*\*' README.md
          grep -q '^## \[0.8.7\] - 2026-10-12$' CHANGELOG.md
          grep -q '^### 0\.8\.7 — failover e resiliência operacional ✅$' docs/ROADMAP.md
          grep -q '^### 0\.8\.8 — comandos remotos controlados$' docs/ROADMAP.md
          git diff --check
      - name: Commit docs
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md docs/ROADMAP.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'release: document MANAGER 0.8.7'
          git push origin HEAD:release/0.8.7
