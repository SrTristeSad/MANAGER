name: Temporary Fix Telegram Bot ShellCheck
on:
  push:
    branches: [feature/0.9.0-telegram-bot-ingress]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.9.0-telegram-bot-ingress
      - shell: bash
        run: |
          set -euxo pipefail
          python3 tmp_fix_telegram_bot_shellcheck.py
          bash -n modules/telegram_bot.sh
          if ! command -v shellcheck >/dev/null; then sudo apt-get update && sudo apt-get install -y shellcheck; fi
          shellcheck -x modules/telegram_bot.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/telegram_bot.sh
          git commit -m 'fix: satisfy ShellCheck in Telegram Bot ingress'
          git push origin HEAD:feature/0.9.0-telegram-bot-ingress
