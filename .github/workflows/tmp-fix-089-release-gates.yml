name: Temporary fix MANAGER 0.8.9 release gates

on:
  push:
    branches:
      - release/0.8.9
    paths:
      - .github/workflows/tmp-fix-089-release-gates.yml
      - scripts/tmp_fix_089_release_gates.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.8.9
          fetch-depth: 0

      - name: Apply release gate fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp_fix_089_release_gates.py
          grep -q '^## \[0.8.9\] - 2026-10-14$' CHANGELOG.md
          grep -q 'mkdir -m 700 /tmp/final-wg-rotated-retry' .github/workflows/hive-security-final-gate.yml
          git diff --check

      - name: Build gate-fix commit object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/hive-remote-final-e2e.yml .github/workflows/hive-security-final-gate.yml
          git commit -m 'test: align final gates with 0.8.9 release'
          echo "GATE_FIX_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:release/0.8.9
