name: Temporary Fix Manager Help
on:
  push:
    branches: [feature/0.9.0-telegram-bot-ingress]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.9.0-telegram-bot-ingress
      - shell: bash
        run: |
          set -euxo pipefail
          python3 tmp_fix_manager_help.py
          bash -n manager
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager
          git commit -m 'fix: preserve Telegram gateway help compatibility'
          git push origin HEAD:feature/0.9.0-telegram-bot-ingress
