name: Complete MANAGER 0.8.4 Authority

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  complete:
    if: github.head_ref == 'release/0.8.4' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply authority completion patch
        run: |
          set -euxo pipefail
          python3 tools/extend_0_8_4.py
          bash -n manager modules/protocol_leases.sh modules/hive_leases.sh modules/hive_scheduler.sh
      - name: Validate embedded Python syntax
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('modules/hive_leases.sh','modules/hive_scheduler.sh'):
              text=Path(name).read_text()
              body=text.split("python3 - \"$@\" <<'PY'\n",1)[1].rsplit('\nPY\n',1)[0]
              compile(body,name,'exec')
          PY
      - name: Commit completed authority
        run: |
          set -euxo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add manager modules/protocol_leases.sh modules/hive_leases.sh .github/workflows/hive-scheduler.yml
          git commit -m 'feat: complete global lease authority contracts'
          git push origin HEAD:${{ github.head_ref }}
