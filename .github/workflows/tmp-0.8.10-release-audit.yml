name: Temporary Apply 0.8.10 Release

on:
  push:
    branches:
      - release/0.8.10-final-gate

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.8.10-final-gate
      - name: Apply release patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/tmp-apply-0.8.10-release.py
          bash -n manager lib/*.sh install.sh rollback.sh uninstall.sh modules/*.sh
          git diff --check
          test "$(cat VERSION)" = 0.8.10
          grep -q '^name: Hive Observability 0.8.10 Final Gate$' .github/workflows/hive-observability-final-gate.yml
          grep -q '^name: Validate MANAGER 0.8.10 Release Metadata$' .github/workflows/0-8-10-release.yml
          test ! -e .github/workflows/0-8-4-release-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: prepare MANAGER 0.8.10 final gate'
          git push origin HEAD:release/0.8.10-final-gate
