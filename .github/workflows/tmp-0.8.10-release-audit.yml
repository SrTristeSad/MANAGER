name: Temporary Apply 0.8.10 Release

on:
  push:
    branches:
      - release/0.8.10-final-gate

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.8.10-final-gate
      - name: Apply non-workflow release surface
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/hive-remote-final-e2e.yml')
          text=p.read_text()
          old=r"          ! grep -q '^## \[0.8.10\]' CHANGELOG.md"
          new=r"          ! grep -q '^## \\[0.8.10\\]' CHANGELOG.md"
          if text.count(old) != 1:
              raise SystemExit(f'release boundary pre-normalization mismatch: {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
          python3 .github/tmp-apply-0.8.10-release.py
          bash -n manager lib/*.sh install.sh rollback.sh uninstall.sh modules/*.sh
          git diff --check
          test "$(cat VERSION)" = 0.8.10
          grep -q '^### 0.8.10 — observabilidade distribuída ✅$' docs/ROADMAP.md
          grep -q '^## \[0.8.10\] - 2026-10-14$' CHANGELOG.md
          # GitHub Actions token cannot update workflow files. Restore them here;
          # permanent workflow changes are applied through the GitHub connector.
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION README.md CHANGELOG.md docs/ROADMAP.md docs/HIVE_OBSERVABILITY.md
          git diff --cached --check
          git commit -m 'release: prepare MANAGER 0.8.10 documentation'
          git push origin HEAD:release/0.8.10-final-gate
