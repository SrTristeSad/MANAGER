name: Fix WireGuard gate base64 parser

on:
  push:
    branches: [feature/0.8.9-wireguard-rotation]
    paths: [.github/workflows/tmp-fix-wg-gate-parser.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.9-wireguard-rotation
          fetch-depth: 0
      - name: Preserve base64 padding in public-key assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/hive-wg-key-rotation.yml')
          s=p.read_text(encoding='utf-8')
          old="awk -F= '$1==\"wireguard_public_key\"{print $2}'"
          new="sed -n 's/^wireguard_public_key=//p'"
          count=s.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 public-key parsers, found {count}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git diff --check
      - name: Commit gate fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/hive-wg-key-rotation.yml
          git commit -m 'ci: preserve WireGuard base64 padding in rotation gate'
          git push origin HEAD:feature/0.8.9-wireguard-rotation
