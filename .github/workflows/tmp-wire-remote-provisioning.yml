name: Temporary Wire 0.8.5 Remote Provisioning

on:
  push:
    branches: [feature/0.8.5-remote-provisioning]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.5-remote-provisioning
      - name: Apply remote provisioning integration
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
