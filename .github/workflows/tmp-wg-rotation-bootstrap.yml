name: Bootstrap Hive 0.8.9 WireGuard rotation

on:
  push:
    branches: [feature/0.8.9-wireguard-rotation]
    paths: [.github/workflows/tmp-wg-rotation-bootstrap.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.9-wireguard-rotation
          fetch-depth: 0

      - name: Apply WireGuard rotation slice
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/hive-wg-rotation.gz.b64 <<'B64'

B64
          base64 -d /tmp/hive-wg-rotation.gz.b64 | gzip -d > modules/hive_wg_rotation.sh
          chmod 0755 modules/hive_wg_rotation.sh

          cat > /tmp/patch-wg-rotation.gz.b64 <<'B64'

B64
          base64 -d /tmp/patch-wg-rotation.gz.b64 | gzip -d > /tmp/patch_wg_rotation.py
          python3 /tmp/patch_wg_rotation.py

          bash -n modules/hive_wg_rotation.sh
          bash -n manager
          bash -n install.sh
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/hive_wg_rotation.sh manager install.sh docs/ROADMAP.md docs/HIVE.md
          git commit -m 'feat: add staged WireGuard mesh key rotation'
          git push origin HEAD:feature/0.8.9-wireguard-rotation
