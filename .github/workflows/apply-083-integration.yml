name: Apply 0.8.3 scheduler integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-083-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply scheduler public CLI and lifecycle integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Public manager hive node ... surface.
          p = Path('manager')
          s = p.read_text()
          usage_anchor = '  manager hive health controller rotate-tls\n                                  heartbeat assinado e saúde distribuída dos nós\n'
          usage_add = '''  manager hive node status|list\n  manager hive node show NODE\n  manager hive node placement NODE NAME COUNTRY REGION POOL\n  manager hive node drain NODE [REASON]\n  manager hive node undrain NODE\n  manager hive node select PROTOCOL [REGION] [POOL] [STICKY] [NODE_SCOPE]\n                                  scheduler weighted least-loaded / drain / failover\n'''
          if 'manager hive node status|list' not in s:
              if usage_anchor not in s:
                  raise SystemExit('manager usage anchor not found')
              s = s.replace(usage_anchor, usage_anchor + usage_add, 1)

          case_anchor = '''      controller)\n        case "${3:-status}" in\n'''
          node_block = '''      node)\n        case "${3:-status}" in\n          status) exec "$MANAGER_HOME/modules/hive_scheduler.sh" --status ;;\n          list) exec "$MANAGER_HOME/modules/hive_scheduler.sh" --list ;;\n          show) [[ -n "${4:-}" ]] || { err "Uso: manager hive node show NODE"; exit 64; }; exec "$MANAGER_HOME/modules/hive_scheduler.sh" --show "$4" ;;\n          placement)\n            [[ -n "${4:-}" && -n "${5:-}" && -n "${6:-}" && -n "${7:-}" && -n "${8:-}" ]] || { err "Uso: manager hive node placement NODE NAME COUNTRY REGION POOL"; exit 64; }\n            exec "$MANAGER_HOME/modules/hive_scheduler.sh" --placement "$4" "$5" "$6" "$7" "$8"\n            ;;\n          drain) [[ -n "${4:-}" ]] || { err "Uso: manager hive node drain NODE [REASON]"; exit 64; }; exec "$MANAGER_HOME/modules/hive_scheduler.sh" --drain "$4" "${5:-admin-drain}" ;;\n          undrain) [[ -n "${4:-}" ]] || { err "Uso: manager hive node undrain NODE"; exit 64; }; exec "$MANAGER_HOME/modules/hive_scheduler.sh" --undrain "$4" ;;\n          select)\n            [[ -n "${4:-}" ]] || { err "Uso: manager hive node select PROTOCOL [REGION] [POOL] [STICKY] [NODE_SCOPE]"; exit 64; }\n            exec "$MANAGER_HOME/modules/hive_scheduler.sh" --select "$4" "${5:-}" "${6:-}" "${7:-}" "${8:-*}"\n            ;;\n          *) err "Uso: manager hive node {status|list|show|placement|drain|undrain|select} ..."; exit 64 ;;\n        esac\n        ;;\n'''
          if '      node)\n        case "${3:-status}" in' not in s:
              if case_anchor not in s:
                  raise SystemExit('manager hive controller anchor not found')
              # Insert before the Hive controller branch, not Automation controller branches.
              health_end = '          *) err "Uso: manager hive health {status|configure|disable|send|controller ...}"; exit 64 ;;\n        esac\n        ;;\n'
              idx = s.find(health_end)
              if idx < 0:
                  raise SystemExit('manager health block end not found')
              insert_at = idx + len(health_end)
              s = s[:insert_at] + node_block + s[insert_at:]
          s = s.replace('Uso: manager hive {status|request|accept|network ...|health ...|controller ...}',
                        'Uso: manager hive {status|request|accept|network ...|health ...|node ...|controller ...}')
          p.write_text(s)

          # Scheduler lifecycle: normal uninstall preserves placement/sticky state;
          # purge removes scheduler state and audit before /opt/manager disappears.
          p = Path('uninstall.sh')
          s = p.read_text()
          lifecycle_anchor = '# Automation v2 possui o socket Unix local e pode possuir o gateway TLS remoto.\n'
          lifecycle_block = '''# Scheduler da Colmeia não possui daemon próprio. No uninstall normal seu estado\n# de placement/sticky é preservado; --purge remove estado e auditoria explicitamente.\nif [[ -x /opt/manager/modules/hive_scheduler.sh ]]; then\n  if $PURGE; then\n    /opt/manager/modules/hive_scheduler.sh --purge >/dev/null 2>&1 || true\n  else\n    /opt/manager/modules/hive_scheduler.sh --detach >/dev/null 2>&1 || true\n  fi\nelse\n  if $PURGE; then\n    rm -rf /etc/manager/hive/controller/scheduler /var/lib/manager/hive-scheduler\n    rm -f /var/log/manager/hive-scheduler-audit.jsonl\n  fi\nfi\n\n'''
          if 'Scheduler da Colmeia não possui daemon próprio.' not in s:
              if lifecycle_anchor not in s:
                  raise SystemExit('uninstall automation anchor not found')
              s = s.replace(lifecycle_anchor, lifecycle_block + lifecycle_anchor, 1)
          p.write_text(s)

          # Extend scheduler CI with public manager contract and lifecycle state.
          p = Path('.github/workflows/hive-scheduler.yml')
          s = p.read_text()
          if 'Public manager hive node surface' not in s:
              marker = '      - name: Build isolated controller observations\n'
              block = '''      - name: Public manager hive node surface\n        shell: bash\n        run: |\n          set -euxo pipefail\n          out="$(sudo manager hive node status)"\n          grep -q '^contract=manager-hive-scheduler-v1$' <<<"$out"\n          grep -q '^scheduler=weighted-least-loaded$' <<<"$out"\n          if sudo manager hive node select invalid-protocol; then\n            echo 'public scheduler CLI accepted invalid protocol' >&2\n            exit 1\n          fi\n\n'''
              if marker not in s:
                  raise SystemExit('scheduler workflow marker not found')
              s = s.replace(marker, block + marker, 1)
          if 'Public CLI placement drain selection and lifecycle' not in s:
              s += '''\n      - name: Public CLI placement drain selection and lifecycle\n        shell: bash\n        run: |\n          set -euxo pipefail\n          pub='sudo env MANAGER_ETC=/tmp/hive-scheduler-etc MANAGER_HIVE_HEALTH_DATA_DIR=/tmp/hive-scheduler-health MANAGER_HIVE_SCHEDULER_DATA_DIR=/tmp/hive-scheduler-runtime MANAGER_HIVE_SCHEDULER_AUDIT_FILE=/tmp/hive-scheduler-audit.jsonl manager hive node'\n          listed="$(eval "$pub list")"\n          grep -q 'node-1111111111111111|BR-SP-01' <<<"$listed"\n          shown="$(eval "$pub show BR-SP-01")"\n          grep -q '^node_id=node-1111111111111111$' <<<"$shown"\n          selected="$(eval "$pub select wireguard BR-SP PREMIUM public-sticky '*'")"\n          grep -q '^selected_node=' <<<"$selected"\n          drained="$(eval "$pub drain BR-SP-01 public-maintenance")"\n          grep -q '^existing_sessions_terminated=0$' <<<"$drained"\n          eval "$pub undrain BR-SP-01" | grep -q '^draining=0$'\n\n          # Normal detach is intentionally state-preserving. Purge removes all scheduler state.\n          sudo env MANAGER_ETC=/tmp/hive-scheduler-etc MANAGER_HIVE_HEALTH_DATA_DIR=/tmp/hive-scheduler-health MANAGER_HIVE_SCHEDULER_DATA_DIR=/tmp/hive-scheduler-runtime MANAGER_HIVE_SCHEDULER_AUDIT_FILE=/tmp/hive-scheduler-audit.jsonl /opt/manager/modules/hive_scheduler.sh --detach\n          sudo test -d /tmp/hive-scheduler-etc/hive/controller/scheduler\n          sudo env MANAGER_ETC=/tmp/hive-scheduler-etc MANAGER_HIVE_HEALTH_DATA_DIR=/tmp/hive-scheduler-health MANAGER_HIVE_SCHEDULER_DATA_DIR=/tmp/hive-scheduler-runtime MANAGER_HIVE_SCHEDULER_AUDIT_FILE=/tmp/hive-scheduler-audit.jsonl /opt/manager/modules/hive_scheduler.sh --purge\n          sudo test ! -e /tmp/hive-scheduler-etc/hive/controller/scheduler\n          sudo test ! -e /tmp/hive-scheduler-runtime\n          sudo test ! -e /tmp/hive-scheduler-audit.jsonl\n'''
          p.write_text(s)
          PY

          bash -n manager uninstall.sh modules/hive_scheduler.sh

      - name: Commit integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-083-integration.yml
          git config user.name 'SrTristeSad'
          git config user.email '48489740+SrTristeSad@users.noreply.github.com'
          git add manager uninstall.sh .github/workflows/hive-scheduler.yml .github/workflows/apply-083-integration.yml
          git commit -m 'feat: integrate Hive scheduler public CLI and lifecycle'
          git push origin HEAD:main
