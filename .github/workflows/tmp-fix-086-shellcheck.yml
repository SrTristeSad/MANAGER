name: Temporary Fix 0.8.6 ShellCheck

on:
  push:
    branches: [feature/0.8.6-global-accounting]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.6-global-accounting
      - name: Replace ambiguous status chain
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('modules/hive_accounting.sh')
          s=p.read_text()
          old='  systemctl is-active --quiet manager-hive-accounting-sync.timer 2>/dev/null && active=1 || true\n'
          new='  if systemctl is-active --quiet manager-hive-accounting-sync.timer 2>/dev/null; then\n    active=1\n  fi\n'
          if new not in s:
              if old not in s:
                  raise SystemExit('status chain anchor missing')
              p.write_text(s.replace(old,new,1))
          PY
          bash -n modules/hive_accounting.sh
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -x modules/hive_accounting.sh
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/hive_accounting.sh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: satisfy accounting shellcheck gate'
          git push origin HEAD:feature/0.8.6-global-accounting
