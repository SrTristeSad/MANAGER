name: Bootstrap Hive 0.8.9 key rotation

on:
  push:
    branches: [feature/0.8.9-key-rotation]
    paths: [.github/workflows/rotation-bootstrap.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.9-key-rotation
          fetch-depth: 0

      - name: Write implementation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/hive-key-rotation.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/hive-key-rotation.gz.b64 | gzip -d > modules/hive_key_rotation.sh
          chmod 0755 modules/hive_key_rotation.sh

          cat > /tmp/rotation-patch.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/rotation-patch.gz.b64 | gzip -d > /tmp/rotation_patch.py
          python3 /tmp/rotation_patch.py

          bash -n modules/hive_key_rotation.sh
          bash -n manager
          bash -n install.sh

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/hive_key_rotation.sh manager install.sh docs/ROADMAP.md docs/HIVE.md
          git diff --cached --check
          git commit -m 'feat: add Hive Ed25519 key rotation contracts'
          git push origin HEAD:feature/0.8.9-key-rotation
