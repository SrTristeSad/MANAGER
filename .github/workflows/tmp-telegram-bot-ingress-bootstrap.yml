name: Temporary Telegram Bot Ingress Bootstrap

on:
  push:
    branches: [feature/0.9.0-telegram-bot-ingress]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.9.0-telegram-bot-ingress
      - name: Apply product integration
        shell: bash
        run: |
          set -euxo pipefail
          python3 tmp_patch_telegram_bot_ingress.py
          git diff --check
      - name: Commit product integration
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/telegram_gateway.sh modules/telegram_bot.sh manager install.sh uninstall.sh docs/TELEGRAM.md docs/ROADMAP.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: integrate Telegram Bot long-polling ingress'
          git push origin HEAD:feature/0.9.0-telegram-bot-ingress
