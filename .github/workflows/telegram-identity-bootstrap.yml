name: Temporary Telegram Identity Bootstrap

on:
  push:
    branches:
      - feature/0.9.0-telegram-identity
    paths:
      - .github/workflows/telegram-identity-bootstrap.yml
      - .github/telegram_identity_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.9.0-telegram-identity
      - name: Apply product patch
        run: python3 .github/telegram_identity_patch.py
      - name: Validate patch
        run: |
          set -euo pipefail
          bash -n manager
          bash -n install.sh
          bash -n modules/telegram_identity.sh
          git diff --check
      - name: Commit product patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager install.sh docs/ROADMAP.md modules/telegram_identity.sh docs/TELEGRAM.md
          git commit -m 'feat: integrate Telegram identity RBAC foundation'
          git push origin HEAD:feature/0.9.0-telegram-identity
