name: Temporary Allocation Distribution Escape Fix

on:
  push:
    branches:
      - feature/0.8.5-allocation-distribution
    paths:
      - scripts/tmp_fix_distribution_escape.py
      - .github/workflows/tmp-fix-distribution-escape.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.5-allocation-distribution
          fetch-depth: 0

      - name: Fix and validate embedded Python
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/tmp_fix_distribution_escape.py
          python3 - <<'PY'
          from pathlib import Path
          for path in ('modules/hive_allocations.sh','modules/hive_leases.sh'):
              text=Path(path).read_text()
              marker="python3 - \"$@\" <<'PY'\n"
              start=text.index(marker)+len(marker)
              end=text.rindex('\nPY')
              code=text[start:end]
              compile(code,path,'exec')
          PY
          git diff --check modules/hive_allocations.sh

      - name: Commit product fix
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'SrTristeSad'
          git config user.email '48489740+SrTristeSad@users.noreply.github.com'
          git add modules/hive_allocations.sh
          git commit -m 'fix: preserve allocation outbox newline encoding'
          git push origin HEAD:feature/0.8.5-allocation-distribution
