name: Integrate MANAGER 0.8.4

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'release/0.8.4' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply integration patch
        run: |
          set -euxo pipefail
          python3 tools/integrate_0_8_4.py
          bash -n manager install.sh uninstall.sh modules/protocol_leases.sh modules/hive_lifecycle.sh modules/hive_scheduler.sh modules/hive_leases.sh
      - name: Commit integrated tree
        run: |
          set -euxo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add manager install.sh uninstall.sh modules/protocol_leases.sh modules/hive_lifecycle.sh modules/hive_scheduler.sh
          git commit -m 'feat: integrate Hive global lease enforcement'
          git push origin HEAD:${{ github.head_ref }}
