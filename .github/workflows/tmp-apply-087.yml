name: Temporary Apply 0.8.7 Recovery Patch

on:
  push:
    branches: [feature/0.8.7-authority-recovery]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.7-authority-recovery
      - name: Apply patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/tmp_apply_087.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/HIVE.md')
          p.write_text(p.read_text().rstrip() + '\n')
          PY
          bash -n manager
          bash -n modules/hive_leases.sh
          python3 - <<'PY'
          from pathlib import Path
          s=Path('modules/hive_leases.sh').read_text()
          start=s.index("python3 - \"$@\" <<'PY'\n") + len("python3 - \"$@\" <<'PY'\n")
          end=s.rindex("\nPY\n")
          compile(s[start:end], 'hive_leases_embedded.py', 'exec')
          PY
          git diff --check
          grep -q 'def node_probe()' modules/hive_leases.sh
          grep -q 'node-authority-recovered' modules/hive_leases.sh
          grep -q 'manager hive lease node probe' docs/HIVE.md
      - name: Commit product changes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/hive_leases.sh manager docs/ROADMAP.md docs/HIVE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: track Hive authority outage and recovery state'
          git push origin HEAD:feature/0.8.7-authority-recovery
