name: Temporary Apply 0.8.10 Operational Timeseries

on:
  push:
    branches:
      - feature/0.8.10-operational-timeseries

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.10-operational-timeseries
      - name: Apply product and documentation changes
        shell: bash
        run: |
          set -euxo pipefail
          python3 .github/tmp-apply-0.8.10-timeseries.py
          bash -n manager
          bash -n modules/hive_observability.sh
          python3 - <<'PY'
          from pathlib import Path
          text=Path('modules/hive_observability.sh').read_text()
          marker='python3 - "$@" <<\'PY\'\n'
          start=text.index(marker)+len(marker)
          end=text.rindex('\nPY')
          compile(text[start:end], 'hive_observability embedded python', 'exec')
          PY
          grep -q 'manager-hive-observability-metrics-v1' modules/hive_observability.sh
          grep -q 'manager-hive-observability-series-v1' modules/hive_observability.sh
          grep -q 'manager hive observe metrics' manager
          grep -q 'manager hive observe series' docs/HIVE_OBSERVABILITY.md
          test "$(cat VERSION)" = 0.8.9
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manager modules/hive_observability.sh docs/HIVE_OBSERVABILITY.md docs/ROADMAP.md
          git commit -m 'feat: add Hive operational metrics and timeseries'
          git push origin HEAD:feature/0.8.10-operational-timeseries
