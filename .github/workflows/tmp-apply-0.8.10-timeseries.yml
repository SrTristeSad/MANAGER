    for path in paths:
        for obj in iter_jsonl(path) or ():
            try:
                epoch = int(obj.get("epoch", obj.get("received_at", 0)))
            except (TypeError, ValueError):
                continue
            if epoch < since:
                continue
            if predicate and not predicate(obj):
                continue
            if sanitizer:
                obj = sanitizer(obj)
                if obj is None:
                    continue
