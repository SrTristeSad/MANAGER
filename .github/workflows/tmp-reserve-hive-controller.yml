name: Temporary Reserve Hive Controller Principal

on:
  push:
    branches: [feature/0.8.8-remote-routing]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.8-remote-routing
      - name: Apply reserved-principal patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/tmp_088_reserve_hive_controller.py
          bash -n modules/automation_principals.sh
          grep -q 'HIVE_CONTROLLER_ID="hive-controller"' modules/automation_principals.sh
          grep -q 'reservado para a identidade da Colmeia' modules/automation_principals.sh
          git diff --check
      - name: Commit hardening
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/automation_principals.sh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: reserve Hive controller automation principal'
          git push origin HEAD:feature/0.8.8-remote-routing
