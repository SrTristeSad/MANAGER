name: Fix MANAGER 0.8.4 Lease Unit

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  fix-unit:
    if: github.head_ref == 'release/0.8.4' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restrict writable systemd path to lease control state
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('modules/hive_leases.sh')
          t=p.read_text()
          old='''PrivateDevices=true\nRestrictSUIDSGID=true\nProtectSystem=full\n'''
          new='''PrivateDevices=true\nRestrictSUIDSGID=true\nProtectSystem=full\nReadWritePaths={LEASE_ETC}\n'''
          if old not in t:
              raise SystemExit('lease unit hardening target missing')
          p.write_text(t.replace(old,new,1))
          PY
          bash -n modules/hive_leases.sh
          python3 - <<'PY'
          from pathlib import Path
          text=Path('modules/hive_leases.sh').read_text()
          body=text.split("python3 - \"$@\" <<'PY'\n",1)[1].rsplit('\nPY\n',1)[0]
          compile(body,'modules/hive_leases.sh','exec')
          PY
      - name: Commit service fix
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add modules/hive_leases.sh
          git commit -m 'fix: allow lease authority to update its control state'
          git push origin HEAD:${{ github.head_ref }}
