name: Temporary Apply 0.8.8 Remote Routing

on:
  push:
    branches: [feature/0.8.8-remote-routing]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.8-remote-routing
      - name: Apply routing patch and validate structure
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/tmp_088_remote_routing.py
          python3 scripts/tmp_088_remote_routing_fix.py
          bash -n modules/hive_remote.sh
          bash -n modules/automation_v2.sh
          bash -n manager
          bash -n install.sh
          bash -n uninstall.sh
          test "$(cat VERSION)" = 0.8.7
          grep -q 'hive_controller_remote_auth=1' modules/automation_v2.sh
          grep -q 'hive_controller_private_key_distribution=0' modules/automation_v2.sh
          grep -q 'manager hive remote controller call NODE_ID ACTION' manager
          grep -q '^## 23\. Roteamento remoto tipado — fundação 0\.8\.8$' docs/HIVE.md
          grep -q 'seleção/roteamento por pool' docs/ROADMAP.md
          python3 - <<'PY'
          from pathlib import Path
          s=Path('modules/automation_v2.sh').read_text()
          body=s.split("<<'PYBACKEND'\n",1)[1].split('\nPYBACKEND',1)[0]
          compile(body,'automation_v2_embedded.py','exec')
          s=Path('modules/hive_remote.sh').read_text()
          body=s.split("<<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          compile(body,'hive_remote_embedded.py','exec')
          PY
          git diff --check
      - name: Commit product patch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/automation_v2.sh install.sh uninstall.sh manager docs/AUTOMATION_V2.md docs/HIVE.md docs/ROADMAP.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: route typed remote operations to enrolled nodes'
          git push origin HEAD:feature/0.8.8-remote-routing
