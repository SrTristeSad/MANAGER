name: Shell CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n manager lib/*.sh install.sh rollback.sh uninstall.sh modules/*.sh

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          shellcheck -x manager lib/*.sh install.sh rollback.sh uninstall.sh modules/*.sh

      - name: Safety regression checks
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn 'iptables[[:space:]]+-F|ip6tables[[:space:]]+-F|nft[[:space:]]+flush[[:space:]]+ruleset|chmod[[:space:]]+777' \
            manager install.sh rollback.sh uninstall.sh lib modules; then
            echo 'Unsafe legacy firewall/permission pattern detected.' >&2
            exit 1
          fi
          if grep -REn 'http_access[[:space:]]+allow[[:space:]]+all|src[[:space:]]+0\.0\.0\.0/0' modules/proxies.sh; then
            echo 'Open Squid proxy pattern detected.' >&2
            exit 1
          fi

      - name: Version format
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]]

      - name: Installer source policy
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          if sudo env -u GITHUB_ACTIONS MANAGER_REPO_RAW="http://example.invalid/manager" bash install.sh >/tmp/manager-http-source.log 2>&1; then
            echo 'Installer accepted insecure HTTP source.' >&2
            exit 1
          fi
          grep -q 'Fonte de instalação não suportada' /tmp/manager-http-source.log

          if sudo env -u GITHUB_ACTIONS MANAGER_REPO_RAW="file://${GITHUB_WORKSPACE}" bash install.sh >/tmp/manager-file-source.log 2>&1; then
            echo 'Installer accepted file:// without explicit local-test permission.' >&2
            exit 1
          fi
          grep -q 'Fonte file:// só é permitida' /tmp/manager-file-source.log

      - name: Installer and recovery smoke test
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euxo pipefail
          source_url="file://${GITHUB_WORKSPACE}"

          sudo env MANAGER_ALLOW_FILE_SOURCE=1 MANAGER_REPO_RAW="$source_url" bash install.sh
          test -x /opt/manager/manager
          test -f /opt/manager/lib/identity.sh
          test -x /opt/manager/modules/connection_engine.sh
          test -x /opt/manager/modules/policy_engine.sh
          test -x /opt/manager/modules/session_engine.sh
          test -x /opt/manager/modules/wireguard.sh
          test -x /opt/manager/modules/openvpn.sh
          test -x /opt/manager/modules/adblock.sh
          test -x /opt/manager/modules/health.sh
          test -x /opt/manager/modules/maintenance.sh
          test -x /opt/manager/modules/ssh_keys.sh
          test -x /opt/manager/modules/ssh_monitor.sh
          test -x /opt/manager/modules/user_transfer.sh
          test -x /opt/manager/modules/resellers.sh
          test -x /opt/manager/modules/reseller_accounts.sh
          test -x /opt/manager/modules/proxy_hosts.sh
          test -x /opt/manager/modules/proxies.sh
          test -x /opt/manager/modules/banner.sh
          test -x /opt/manager/modules/speedtest.sh
          test -f /etc/systemd/system/manager-policy-reconcile.service
          test -f /etc/systemd/system/manager-policy-reconcile.timer
          test -f /etc/systemd/system/manager-policy-reconcile.path
          test -f /etc/systemd/system/manager-session-cleanup.service
          test -f /etc/systemd/system/manager-session-cleanup.timer
          test -f /etc/systemd/system/manager-session-reconcile.path
          session_runtime="$(sudo /opt/manager/modules/session_engine.sh --init)"
          test "$session_runtime" = "/run/manager-session-leases"
          sudo test -d "$session_runtime/active"
          test "$(cat /opt/manager/VERSION)" = "$(tr -d '[:space:]' < VERSION)"
          test "$(readlink -f /usr/local/bin/manager)" = "/opt/manager/manager"
          test "$(readlink -f /usr/local/bin/menu)" = "/opt/manager/manager"

          test "$(sudo /opt/manager/manager --version)" = "$(tr -d '[:space:]' < VERSION)"
          sudo /opt/manager/manager --help > /tmp/manager-help.log
          grep -q -- '--health' /tmp/manager-help.log
          grep -q -- '--expired' /tmp/manager-help.log
          grep -q -- '--ssh-sessions' /tmp/manager-help.log
          grep -q -- '--proxy-status' /tmp/manager-help.log
          grep -q -- '--proxy-hosts' /tmp/manager-help.log
          grep -q -- '--identities' /tmp/manager-help.log
          grep -q -- '--identity-sessions' /tmp/manager-help.log
          grep -q -- '--leases' /tmp/manager-help.log
          sudo /opt/manager/manager --status >/tmp/manager-status.log
          grep -q 'STATUS DE SERVIÇOS' /tmp/manager-status.log
          sudo /opt/manager/manager --expired >/tmp/manager-expired.log
          sudo /opt/manager/manager --ssh-sessions >/tmp/manager-ssh-sessions.log

          test "$(sudo /opt/manager/modules/resellers.sh --init)" = "/etc/manager/access"
          sudo test -d /etc/manager/access/resellers
          sudo test -d /etc/manager/access/owners
          sudo test -f /etc/manager/access/.lock

          test "$(sudo /opt/manager/modules/connection_engine.sh --init)" = "/etc/manager/connection"
          sudo test -d /etc/manager/connection/identities
          sudo /opt/manager/modules/connection_engine.sh --create ci-user '' 0 1 ssh
          sudo /opt/manager/manager --identities > /tmp/manager-identities.log
          grep -q '^ci-user' /tmp/manager-identities.log
          sudo /opt/manager/manager --identity ci-user > /tmp/manager-identity.log
          grep -q '^state=active$' /tmp/manager-identity.log
          sudo /opt/manager/manager --identity-sessions ci-user > /tmp/manager-identity-sessions.log
          grep -q '^ci-user' /tmp/manager-identity-sessions.log
          grep -q 'total=0' /tmp/manager-identity-sessions.log

          sudo useradd -m -s /bin/bash managerci
          sudo /opt/manager/modules/connection_engine.sh --create ci-bound '' 0 1 ssh
          sudo /opt/manager/modules/connection_engine.sh --bind ci-bound ssh managerci
          sudo /opt/manager/modules/policy_engine.sh --reconcile
          sudo /opt/manager/modules/policy_engine.sh --authorize ssh managerci

          lease1="$(sudo /opt/manager/modules/session_engine.sh --acquire ci-bound ssh managerci device-a 30)"
          session1="$(printf '%s\n' "$lease1" | tr '\t' '\n' | awk -F= '$1=="session_id"{print $2}')"
          epoch1="$(printf '%s\n' "$lease1" | tr '\t' '\n' | awk -F= '$1=="epoch"{print $2}')"
          test "${#session1}" -eq 32
          test "$epoch1" -ge 1
          sudo /opt/manager/manager --leases ci-bound > /tmp/manager-leases.log
          grep -q "$session1" /tmp/manager-leases.log

          retry="$(sudo /opt/manager/modules/session_engine.sh --acquire ci-bound ssh managerci device-a 30)"
          retry_session="$(printf '%s\n' "$retry" | tr '\t' '\n' | awk -F= '$1=="session_id"{print $2}')"
          test "$retry_session" = "$session1"

          if sudo /opt/manager/modules/session_engine.sh --acquire ci-bound ssh managerci device-b 30; then
            echo 'Lease engine exceeded max_sessions=1.' >&2
            exit 1
          fi
          sudo /opt/manager/modules/session_engine.sh --heartbeat "$session1" "$epoch1" 30 >/tmp/lease-heartbeat.log

          switched="$(sudo /opt/manager/modules/session_engine.sh --switch ci-bound ssh managerci device-b 30)"
          session2="$(printf '%s\n' "$switched" | tr '\t' '\n' | awk -F= '$1=="session_id"{print $2}')"
          epoch2="$(printf '%s\n' "$switched" | tr '\t' '\n' | awk -F= '$1=="epoch"{print $2}')"
          test "$session2" != "$session1"
          test "$epoch2" -gt "$epoch1"
          if sudo /opt/manager/modules/session_engine.sh --heartbeat "$session1" "$epoch1" 30; then
            echo 'Stale fenced session renewed after switch.' >&2
            exit 1
          fi
          sudo /opt/manager/manager --leases ci-bound > /tmp/manager-leases.log
          grep -q "$session2" /tmp/manager-leases.log
          if grep -q "$session1" /tmp/manager-leases.log; then
            echo 'Old lease remained active after switch.' >&2
            exit 1
          fi
          sudo test -f /etc/manager/connection/session-epochs/ci-bound.epoch
          test "$(sudo /opt/manager/modules/session_engine.sh --epoch ci-bound)" = "$epoch2"
          sudo /opt/manager/modules/session_engine.sh --release "$session2" "$epoch2"
          test -z "$(sudo /opt/manager/manager --leases ci-bound)"

          short="$(sudo /opt/manager/modules/session_engine.sh --acquire ci-bound ssh managerci device-c 1)"
          short_session="$(printf '%s\n' "$short" | tr '\t' '\n' | awk -F= '$1=="session_id"{print $2}')"
          test "${#short_session}" -eq 32
          sleep 2
          sudo /opt/manager/modules/session_engine.sh --cleanup
          test -z "$(sudo /opt/manager/manager --leases ci-bound)"

          policy_lease="$(sudo /opt/manager/modules/session_engine.sh --acquire ci-bound ssh managerci device-policy 30)"
          policy_session="$(printf '%s\n' "$policy_lease" | tr '\t' '\n' | awk -F= '$1=="session_id"{print $2}')"
          policy_epoch="$(printf '%s\n' "$policy_lease" | tr '\t' '\n' | awk -F= '$1=="epoch"{print $2}')"
          sudo /opt/manager/modules/connection_engine.sh --disable ci-bound
          sudo /opt/manager/modules/session_engine.sh --reconcile
          test -z "$(sudo /opt/manager/manager --leases ci-bound)"
          fenced_epoch="$(sudo /opt/manager/modules/session_engine.sh --epoch ci-bound)"
          test "$fenced_epoch" -gt "$policy_epoch"
          if sudo /opt/manager/modules/session_engine.sh --heartbeat "$policy_session" "$policy_epoch" 30; then
            echo 'Policy-invalidated lease renewed after fencing.' >&2
            exit 1
          fi

          sudo /opt/manager/modules/policy_engine.sh --reconcile
          grep -Eq '^DenyUsers .*managerci' /etc/ssh/sshd_config.d/65-manager-identity-policy.conf
          if sudo /opt/manager/modules/policy_engine.sh --authorize ssh managerci; then
            echo 'Disabled identity was authorized.' >&2
            exit 1
          fi
          sudo /opt/manager/modules/connection_engine.sh --enable ci-bound
          sudo /opt/manager/modules/policy_engine.sh --reconcile
          if grep -Eq '^DenyUsers .*managerci' /etc/ssh/sshd_config.d/65-manager-identity-policy.conf; then
            echo 'Re-enabled identity remained denied in SSH policy.' >&2
            exit 1
          fi
          sudo /opt/manager/modules/policy_engine.sh --authorize ssh managerci

          sudo /opt/manager/modules/connection_engine.sh --disable ci-user
          sudo /opt/manager/manager --identity ci-user > /tmp/manager-identity.log
          grep -q '^state=disabled$' /tmp/manager-identity.log
          sudo /opt/manager/modules/connection_engine.sh --enable ci-user

          sudo /opt/manager/modules/proxies.sh --init
          sudo test -d /etc/manager/proxy/tcp
          sudo test -d /etc/manager/proxy/websocket
          sudo test -d /etc/manager/proxy/tls
          sudo /opt/manager/manager --proxy-status >/tmp/manager-proxy-status.log

          sudo /opt/manager/modules/proxy_hosts.sh --add example.com
          sudo /opt/manager/manager --proxy-hosts > /tmp/manager-proxy-hosts.log
          grep -q '^\.example\.com$' /tmp/manager-proxy-hosts.log
          sudo /opt/manager/modules/proxy_hosts.sh --remove example.com
          test "$(sudo /opt/manager/modules/proxy_hosts.sh --count | tr -d '[:space:]')" = "0"

          health_rc=0
          sudo /opt/manager/manager --health >/tmp/manager-health.log 2>&1 || health_rc=$?
          test "$health_rc" -le 2
          grep -q 'SAÚDE DO SERVIDOR' /tmp/manager-health.log

          sudo env MANAGER_ALLOW_FILE_SOURCE=1 MANAGER_REPO_RAW="$source_url" bash install.sh --update
          test -d /opt/manager.rollback
          test -f /opt/manager.rollback/VERSION

          printf 's\n' | sudo /opt/manager/rollback.sh
          test -x /opt/manager/manager
          test -d /opt/manager.rollback

          sudo /opt/manager/uninstall.sh
          test ! -e /opt/manager
          test ! -e /usr/local/bin/manager
          test -d /etc/manager
          test -f /etc/manager/connection/session-epochs/ci-bound.epoch
          test ! -d /run/manager-session-leases
          test ! -e /etc/systemd/system/manager-session-cleanup.timer
          test ! -e /etc/systemd/system/manager-session-cleanup.service
          test ! -e /etc/systemd/system/manager-session-reconcile.path
          test ! -e /etc/systemd/system/manager-policy-reconcile.timer
          test ! -e /etc/systemd/system/manager-policy-reconcile.path
          test ! -e /etc/ssh/sshd_config.d/65-manager-identity-policy.conf
