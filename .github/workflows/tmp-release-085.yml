name: Temporary Apply 0.8.5 Release Metadata

on:
  push:
    branches: [release/0.8.5]
    paths:
      - .github/workflows/tmp-release-085.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.8.5
      - run: python3 scripts/tmp_release_085.py
      - name: Validate staged release metadata
        shell: bash
        run: |
          set -euxo pipefail
          test "$(cat VERSION)" = 0.8.5
          grep -q 'Versão atual: \*\*0.8.5\*\*' README.md
          grep -q '^## \[0.8.5\] - 2026-10-12$' CHANGELOG.md
          grep -q '^### 0\.8\.5 — VPN allocation / login global ✅$' docs/ROADMAP.md
      - name: Commit release metadata
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSION README.md CHANGELOG.md docs/ROADMAP.md
          git commit -m 'release: prepare MANAGER 0.8.5'
          git push origin HEAD:release/0.8.5
