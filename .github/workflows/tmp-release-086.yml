name: Temporary Apply 0.8.6 Release Metadata

on:
  push:
    branches: [release/0.8.6]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.8.6
      - name: Apply release metadata
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/tmp_release_086.py
          test "$(cat VERSION)" = 0.8.6
          grep -q '^## \[0.8.6\] - 2026-10-12$' CHANGELOG.md
          grep -q '^### 0\.8\.6 — quotas e accounting globais ✅$' docs/ROADMAP.md
          grep -q 'Validate MANAGER 0.8.6 Release Metadata' .github/workflows/0-8-4-release-docs.yml
          git diff --check
      - name: Commit applied release changes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION README.md CHANGELOG.md docs/ROADMAP.md .github/workflows/0-8-4-release-docs.yml .github/workflows/hive-vpn-allocation.yml .github/workflows/hive-vpn-allocation-distribution.yml .github/workflows/hive-vpn-remote-provisioning.yml .github/workflows/hive-vpn-public-login.yml .github/workflows/hive-global-accounting.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'release: prepare MANAGER 0.8.6 metadata'
          git push origin HEAD:release/0.8.6
