name: Temporary Public Login Claim Patch

on:
  push:
    branches:
      - feature/0.8.5-public-login-claim

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.5-public-login-claim
      - name: Apply public login claim patch
        run: python3 scripts/tmp_apply_public_login_claim.py
      - name: Validate shell and embedded Python
        shell: bash
        run: |
          set -euo pipefail
          bash -n manager modules/hive_allocations.sh modules/automation_v2.sh
          python3 - <<'PY'
          from pathlib import Path
          for path, marker, label in [
              ('modules/hive_allocations.sh', "python3 - \"$@\" <<'PY'\n", 'hive_allocations'),
              ('modules/automation_v2.sh', "python3 - \"$@\" <<'PYBACKEND'\n", 'automation_v2'),
          ]:
              text = Path(path).read_text()
              end = '\nPY\n' if label == 'hive_allocations' else '\nPYBACKEND\n'
              code = text.split(marker, 1)[1].split(end, 1)[0]
              compile(code, label + '.py', 'exec')
          PY
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SrTristeSad'
          git config user.email '48489740+SrTristeSad@users.noreply.github.com'
          git add manager modules/hive_allocations.sh modules/automation_v2.sh docs/HIVE.md docs/ROADMAP.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat: add one-shot public Hive login claim'
          git push origin HEAD:feature/0.8.5-public-login-claim
