name: TEMP Fix Telegram Ops Scope

on:
  push:
    branches:
      - feature/0.9.0-telegram-ops-read-api

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.9.0-telegram-ops-read-api
          fetch-depth: 0
      - name: Patch action scope allowlist
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('modules/automation_principals.sh')
          s=p.read_text()
          old='          system.describe|node.usage|connection.preflight|connection.create|connection.status|connection.revoke) ;;'
          new='          system.describe|node.usage|connection.preflight|connection.create|connection.status|connection.revoke|ops.clients|ops.sessions|ops.products|ops.quotas|ops.nodes|ops.diagnostics) ;;'
          if old not in s:
              raise SystemExit('action allowlist anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          grep -q 'ops.clients|ops.sessions|ops.products|ops.quotas|ops.nodes|ops.diagnostics' modules/automation_principals.sh
          bash -n modules/automation_principals.sh
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/automation_principals.sh
          git commit -m 'fix: allow operational reads in principal action scopes'
          git push origin HEAD:feature/0.9.0-telegram-ops-read-api
