name: TEMP Fix Telegram Ops Scope

on:
  push:
    branches:
      - feature/0.9.0-telegram-ops-read-api

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.9.0-telegram-ops-read-api
          fetch-depth: 0
      - name: Patch action scope and fixture
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('modules/automation_principals.sh')
          s=p.read_text()
          old='system.describe|node.usage|connection.preflight|connection.create|connection.status|connection.revoke)'
          new='system.describe|node.usage|connection.preflight|connection.create|connection.status|connection.revoke|ops.clients|ops.sessions|ops.products|ops.quotas|ops.nodes|ops.diagnostics)'
          if s.count(old) != 1:
              raise SystemExit(f'action allowlist anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

          p=Path('.github/workflows/telegram-ops-read.yml')
          s=p.read_text()
          marker="actions='ops.clients,ops.sessions,ops.products,ops.quotas,ops.nodes,ops.diagnostics'"
          if s.count(marker) != 1:
              raise SystemExit(f'fixture marker count={s.count(marker)}')
          indent='          '
          lines=[
              'sudo install -d -m 0700 /etc/manager/access/resellers',
              "cat >/tmp/resellerA.conf <<'EOF'",
              'id=resellerA',
              'role=reseller',
              'parent=',
              'quota=100',
              'enabled=1',
              'created_epoch=1',
              'updated_epoch=1',
              'EOF',
              'sudo install -m 0600 /tmp/resellerA.conf /etc/manager/access/resellers/resellerA.conf',
              '',
              marker,
          ]
          replacement='\n'.join((indent+line) if line else '' for line in lines)
          p.write_text(s.replace(indent+marker, replacement, 1))
          PY
          bash -n modules/automation_principals.sh
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/automation_principals.sh .github/workflows/telegram-ops-read.yml
          git commit -m 'fix: allow operational reads in principal action scopes'
          git push origin HEAD:feature/0.9.0-telegram-ops-read-api
