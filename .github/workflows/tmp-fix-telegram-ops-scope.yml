name: TEMP Fix Telegram Ops Scope

on:
  push:
    branches:
      - feature/0.9.0-telegram-ops-read-api

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.9.0-telegram-ops-read-api
          fetch-depth: 0
      - name: Patch action scope and fixture
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing patch anchor: {path}')
              p.write_text(s.replace(old,new,1))

          replace(
              'modules/automation_principals.sh',
              '''        case "$item" in\n          system.describe|node.usage|connection.preflight|connection.create|connection.status|connection.revoke) ;;\n          *) return 1 ;;\n        esac\n''',
              '''        case "$item" in\n          system.describe|node.usage|connection.preflight|connection.create|connection.status|connection.revoke|ops.clients|ops.sessions|ops.products|ops.quotas|ops.nodes|ops.diagnostics) ;;\n          *) return 1 ;;\n        esac\n'''
          )

          replace(
              '.github/workflows/telegram-ops-read.yml',
              '''          actions='ops.clients,ops.sessions,ops.products,ops.quotas,ops.nodes,ops.diagnostics'\n          sudo manager automation v2 principal create ops-admin admin '*'\n''',
              '''          sudo install -d -m 0700 /etc/manager/access/resellers\n          cat >/tmp/resellerA.conf <<'EOF'\n          id=resellerA\n          role=reseller\n          parent=\n          quota=100\n          enabled=1\n          created_epoch=1\n          updated_epoch=1\n          EOF\n          sudo install -m 0600 /tmp/resellerA.conf /etc/manager/access/resellers/resellerA.conf\n\n          actions='ops.clients,ops.sessions,ops.products,ops.quotas,ops.nodes,ops.diagnostics'\n          sudo manager automation v2 principal create ops-admin admin '*'\n'''
          )
          PY
          bash -n modules/automation_principals.sh
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/automation_principals.sh .github/workflows/telegram-ops-read.yml
          git commit -m 'fix: allow operational reads in principal action scopes'
          git push origin HEAD:feature/0.9.0-telegram-ops-read-api
