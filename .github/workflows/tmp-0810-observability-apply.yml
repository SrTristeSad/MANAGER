name: Temporary apply 0.8.10 observability foundation

on:
  push:
    branches:
      - feature/0.8.10-observability-foundation
    paths:
      - scripts/tmp_apply_0810_observability.py
      - .github/workflows/tmp-0810-observability-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.10-observability-foundation
          fetch-depth: 0
      - name: Apply integration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp_apply_0810_observability.py
          bash -n manager
          bash -n install.sh
          bash -n modules/hive_health.sh
          bash -n modules/hive_observability.sh
          grep -q 'modules/hive_observability.sh' install.sh
          grep -q 'manager hive observe summary' manager
          grep -q 'observabilidade distribuída 🚧' docs/ROADMAP.md
          git diff --check
      - name: Commit non-workflow integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager install.sh modules/hive_health.sh docs/ROADMAP.md
          if git diff --cached --quiet; then
            echo 'No patch changes to commit'
            exit 0
          fi
          git commit -m 'feat: integrate Hive observability foundation'
          git push origin HEAD:feature/0.8.10-observability-foundation
