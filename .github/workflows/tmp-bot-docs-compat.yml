name: Temporary Bot Docs Compat

on:
  push:
    branches: [feature/0.9.0-telegram-bot-ingress]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.9.0-telegram-bot-ingress
      - name: Patch roadmap wording
        shell: bash
        run: |
          set -euxo pipefail
          python3 tmp_bot_docs_compat.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ROADMAP.md
          git commit -m 'docs: preserve Telegram Bot roadmap compatibility wording'
          git push origin HEAD:feature/0.9.0-telegram-bot-ingress
