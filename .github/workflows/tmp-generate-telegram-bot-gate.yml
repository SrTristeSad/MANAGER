name: Temporary Generate Telegram Bot Gate

on:
  push:
    branches: [feature/0.9.0-telegram-bot-ingress]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.9.0-telegram-bot-ingress
      - name: Generate permanent gate
        shell: bash
        run: |
          set -euxo pipefail
          python3 tmp_generate_telegram_bot_gate.py
          git diff --check
      - name: Commit generated gate
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/telegram-bot-ingress.yml
          git commit -m 'ci: gate Telegram Bot long-polling ingress'
          git push origin HEAD:feature/0.9.0-telegram-bot-ingress
