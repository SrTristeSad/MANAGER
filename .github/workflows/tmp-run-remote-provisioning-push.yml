name: Temporary Execute Remote Provisioning Wiring

on:
  push:
    branches:
      - feature/0.8.5-remote-provisioning

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.5-remote-provisioning
      - name: Apply and validate remote provisioning integration
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/tmp_apply_remote_provisioning.py
          bash -n modules/provision.sh modules/hive_allocations.sh
          python3 - <<'PY'
          from pathlib import Path
          text=Path('modules/hive_allocations.sh').read_text()
          code=text.split("python3 - \"$@\" <<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          compile(code,'hive_allocations_embedded.py','exec')
          PY
          git config user.name 'SrTristeSad'
          git config user.email '48489740+SrTristeSad@users.noreply.github.com'
          git add modules/provision.sh modules/hive_allocations.sh docs/ROADMAP.md docs/HIVE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: provision Hive allocation resources on selected node'
          git push origin HEAD:feature/0.8.5-remote-provisioning
