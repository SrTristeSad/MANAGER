name: Temporary Compatibility Patch

on:
  push:
    branches:
      - feature/0.8.5-remote-provisioning

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.5-remote-provisioning
      - name: Apply compatibility patch
        run: python3 scripts/tmp_apply_remote_provisioning.py
      - name: Validate shell
        run: bash -n modules/provision.sh
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SrTristeSad'
          git config user.email '48489740+SrTristeSad@users.noreply.github.com'
          git add modules/provision.sh .github/workflows/hive-vpn-allocation-distribution.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: preserve existing MANAGER protocol bindings'
          git push origin HEAD:feature/0.8.5-remote-provisioning
