name: Hive Remote Pool Routing

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hive-remote-pool-routing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install current MANAGER tree
        shell: bash
        run: |
          set -euxo pipefail
          sudo env MANAGER_ALLOW_FILE_SOURCE=1 MANAGER_REPO_RAW="file://${GITHUB_WORKSPACE}" bash install.sh
          test "$(sudo cat /opt/manager/VERSION)" = 0.8.9
          status="$(sudo manager hive remote controller status 2>/dev/null || true)"
          # Controller is initialized in the next step; product code must already expose the pool implementation.
          grep -q 'controller-select-pool' /opt/manager/modules/hive_remote.sh
          grep -q 'controller-call-pool' /opt/manager/modules/hive_remote.sh
          grep -q 'pool_selector=hive-scheduler-weighted-least-loaded' /opt/manager/modules/hive_remote.sh

      - name: Initialize controller and first enrolled node
        shell: bash
        run: |
          set -euxo pipefail
          sudo manager hive controller init >/dev/null
          controller_fp="$(sudo manager hive controller fingerprint)"
          printf '%s\n' "$controller_fp" >/tmp/controller.fp
          sudo manager hive request /tmp/node1.request.json >/dev/null
          sudo manager hive controller approve /tmp/node1.request.json /tmp/node1.bundle.json >/dev/null
          sudo manager hive accept /tmp/node1.bundle.json "$controller_fp" >/dev/null
          node1="$(sudo manager hive status | awk -F= '$1=="node_id"{print $2}')"
          test -n "$node1"
          printf '%s\n' "$node1" >/tmp/node1.id
          sudo manager --node-set pool BR-SP >/dev/null
          sudo manager hive node placement "$node1" BR-SP-A BR BR-SP PREMIUM >/dev/null

          sudo manager automation v2 remote enable 127.0.0.1 19443 >/dev/null
          ready=0
          for _ in $(seq 1 50); do
            if sudo ss -ltnH | awk '$4 ~ /:19443$/ {found=1} END {exit(found ? 0 : 1)}'; then ready=1; break; fi
            sleep 0.1
          done
          test "$ready" -eq 1
          fp="$(sudo manager automation v2 remote status | awk -F= '$1=="server_fingerprint"{print $2}')"
          test -n "$fp"
          printf '%s\n' "$fp" >/tmp/remote.fp

          sudo manager hive remote node enable 127.0.0.1:19443 'system.describe,node.usage' /tmp/node1.route.json >/dev/null
          sudo manager hive remote controller accept /tmp/node1.route.json >/dev/null

      - name: Enroll a second logical node with a narrower route
        shell: bash
        run: |
          set -euxo pipefail
          node2_etc=/tmp/manager-node2/etc/manager
          sudo mkdir -p "$node2_etc"
          sudo env MANAGER_ETC="$node2_etc" /opt/manager/modules/hive_identity.sh --install >/dev/null
          sudo env MANAGER_ETC="$node2_etc" /opt/manager/modules/hive_identity.sh --request /tmp/node2.request.json >/dev/null
          sudo manager hive controller approve /tmp/node2.request.json /tmp/node2.bundle.json >/dev/null
          sudo env MANAGER_ETC="$node2_etc" /opt/manager/modules/hive_identity.sh --accept /tmp/node2.bundle.json "$(cat /tmp/controller.fp)" >/dev/null
          node2="$(sudo env MANAGER_ETC="$node2_etc" /opt/manager/modules/hive_identity.sh --status | awk -F= '$1=="node_id"{print $2}')"
          test -n "$node2"
          test "$node2" != "$(cat /tmp/node1.id)"
          printf '%s\n' "$node2" >/tmp/node2.id
          sudo manager hive node placement "$node2" BR-SP-B BR BR-SP PREMIUM >/dev/null

          sudo mkdir -p "$node2_etc/automation/v2"
          fp="$(cat /tmp/remote.fp)"
          sudo tee "$node2_etc/automation/v2/remote.conf" >/dev/null <<EOF
          version=1
          enabled=1
          bind=127.0.0.1
          port=19443
          tls=TLSv1.3
          pinning=sha256
          server_fingerprint=$fp
          EOF
          sudo chmod 600 "$node2_etc/automation/v2/remote.conf"
          sudo env MANAGER_ETC="$node2_etc" /opt/manager/modules/hive_remote.sh --node-enable 127.0.0.1:19443 system.describe /tmp/node2.route.json >/dev/null
          sudo manager hive remote controller accept /tmp/node2.route.json >/dev/null
          test "$(sudo manager hive remote controller list | grep -c '^node-')" = 2

      - name: Publish deterministic healthy observations for both nodes
        shell: bash
        run: |
          set -euxo pipefail
          sudo mkdir -p /etc/manager/hive/controller/health /var/lib/manager/hive-health/nodes
          printf 'version=1\ndegraded_after_seconds=180\noffline_after_seconds=300\n' | sudo tee /etc/manager/hive/controller/health/controller.conf >/dev/null
          now="$(date +%s)"
          sudo python3 - "$now" "$(cat /tmp/node1.id)" "$(cat /tmp/node2.id)" <<'PY'
          import json,sys
          now=int(sys.argv[1])
          for idx,node in enumerate(sys.argv[2:]):
              conf={}
              for line in open(f'/etc/manager/hive/controller/nodes/{node}.conf'):
                  if '=' in line:
                      k,v=line.rstrip().split('=',1); conf[k]=v
              sessions=0 if idx==0 else 50
              obs={'version':1,'node_id':node,'node_epoch':int(conf['node_epoch']),'issued_at':now,'received_at':now,'source':'ci',
                   'base_state':'HEALTHY','base_reason':'ok','metrics':{'sessions':sessions,'max_sessions':100,'capacity':10,'weight':1,
                   'previous_rtt_ms':10 if idx==0 else 20,'protocols':['ssh','wireguard','openvpn'],
                   'service_ssh':'active','service_wireguard':'active','service_openvpn':'active'}}
              open(f'/var/lib/manager/hive-health/nodes/{node}.json','w').write(json.dumps(obs,sort_keys=True,separators=(',',':')))
          PY
          sudo chmod 600 /var/lib/manager/hive-health/nodes/*.json

      - name: Select least-loaded routed node and execute a real pool call
        shell: bash
        run: |
          set -euxo pipefail
          node1="$(cat /tmp/node1.id)"
          select_out="$(sudo manager hive remote controller select PREMIUM ssh system.describe pool-stick)"
          grep -q '^contract=manager-hive-remote-pool-selection-v1$' <<<"$select_out"
          grep -q "^selected_node=${node1}$" <<<"$select_out"
          grep -q '^selection_reason=weighted-least-loaded$' <<<"$select_out"
          grep -q '^routing_source=signed-route-registry+hive-scheduler$' <<<"$select_out"
          grep -q '^arbitrary_target=0$' <<<"$select_out"

          sudo manager hive remote controller call-pool PREMIUM ssh system.describe --sticky pool-call-stick --request-id pool-call-0001 >/tmp/pool-call.json
          sudo python3 - <<'PY'
          import json
          r=json.load(open('/tmp/pool-call.json'))
          assert r['ok'] is True and r['code']==0
          assert r['principal_id']=='hive-controller'
          assert r['principal_role']=='admin'
          PY
          sudo grep -q '"event":"controller-pool-call"' /var/log/manager/hive-remote-audit.jsonl

      - name: Filter candidates by signed action scope
        shell: bash
        run: |
          set -euxo pipefail
          node1="$(cat /tmp/node1.id)"
          out="$(sudo manager hive remote controller select PREMIUM ssh node.usage)"
          grep -q "^selected_node=${node1}$" <<<"$out"
          sudo grep -q '"action_id":"node.usage"' /var/log/manager/hive-remote-audit.jsonl

      - name: Sticky failover respects drain without inventing a second scheduler
        shell: bash
        run: |
          set -euxo pipefail
          node1="$(cat /tmp/node1.id)"
          node2="$(cat /tmp/node2.id)"
          sudo manager hive node drain "$node1" maintenance >/dev/null

          failover="$(sudo manager hive remote controller select PREMIUM ssh system.describe pool-stick)"
          grep -q "^selected_node=${node2}$" <<<"$failover"
          grep -q '^selection_reason=sticky-failover$' <<<"$failover"

          if sudo manager hive remote controller select PREMIUM ssh node.usage >/tmp/usage-deny.out 2>/tmp/usage-deny.err; then
            echo 'pool selector used node lacking the signed action route or ignored drain' >&2
            exit 1
          fi
          grep -q 'Nenhum nó HEALTHY/elegível' /tmp/usage-deny.err

          sudo python3 - "$node2" <<'PY'
          import json,sys
          node=sys.argv[1]; found=False
          with open('/var/log/manager/hive-remote-audit.jsonl') as fh:
              for line in fh:
                  event=json.loads(line)
                  if event.get('event')=='controller-pool-select' and event.get('node_id')==node and event.get('selection_reason')=='sticky-failover':
                      found=True
          assert found
          PY
          sudo manager hive node undrain "$node1" >/dev/null

      - name: Remove revoked routed nodes from pool candidates
        shell: bash
        run: |
          set -euxo pipefail
          node1="$(cat /tmp/node1.id)"
          node2="$(cat /tmp/node2.id)"
          sudo manager hive controller revoke "$node2" ci-pool-fence >/dev/null
          selected="$(sudo manager hive remote controller select PREMIUM ssh system.describe new-stick)"
          grep -q "^selected_node=${node1}$" <<<"$selected"
          if sudo manager hive remote controller call "$node2" system.describe >/tmp/revoked.out 2>/tmp/revoked.err; then
            echo 'revoked node remained directly routable' >&2
            exit 1
          fi
          grep -q 'revogado/desabilitado' /tmp/revoked.err

      - name: Keep 0.8.9 unreleased until final release gate
        shell: bash
        run: |
          set -euxo pipefail
          test "$(sudo cat /opt/manager/VERSION)" = 0.8.9
          sudo manager hive remote controller status | grep -q '^pool_routing=1$'
          sudo manager hive remote controller status | grep -q '^pool_selector=hive-scheduler-weighted-least-loaded$'
          sudo manager hive remote controller status | grep -q '^pool_health_required=HEALTHY$'
          sudo manager hive remote controller status | grep -q '^pool_drain_respected=1$'
