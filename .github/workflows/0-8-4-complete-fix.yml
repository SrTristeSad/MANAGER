name: Complete MANAGER 0.8.4 Authority Fix

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  complete-fix:
    if: github.head_ref == 'release/0.8.4' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Normalize exact patch target and apply completion
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('modules/hive_leases.sh')
          t=p.read_text()
          old='''                 f"port={values['port']}\\ntls_fingerprint={values['tls_fingerprint']}\\ndefault_ttl={values['default_ttl']}\\n"\n                 f"max_ttl={values['max_ttl']}\\ncreated_epoch={conf.get('created_epoch',str(now))}\\nupdated_epoch={now}\\n")'''
          new='''                 f"port={values['port']}\\n"\n                 f"tls_fingerprint={values['tls_fingerprint']}\\ndefault_ttl={values['default_ttl']}\\n"\n                 f"max_ttl={values['max_ttl']}\\ncreated_epoch={conf.get('created_epoch',str(now))}\\nupdated_epoch={now}\\n")'''
          if old not in t:
              raise SystemExit('write_controller_conf normalization target missing')
          p.write_text(t.replace(old,new,1))
          PY
          python3 tools/extend_0_8_4.py
          bash -n manager modules/protocol_leases.sh modules/hive_leases.sh modules/hive_scheduler.sh
      - name: Validate embedded Python syntax
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ('modules/hive_leases.sh','modules/hive_scheduler.sh'):
              text=Path(name).read_text()
              body=text.split("python3 - \"$@\" <<'PY'\n",1)[1].rsplit('\nPY\n',1)[0]
              compile(body,name,'exec')
          PY
      - name: Commit completed authority code
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add manager modules/protocol_leases.sh modules/hive_leases.sh
          git commit -m 'feat: complete global lease authority contracts'
          git push origin HEAD:${{ github.head_ref }}
