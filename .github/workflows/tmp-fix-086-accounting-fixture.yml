name: Temporary Fix 0.8.6 Accounting Fixture

on:
  push:
    branches: [feature/0.8.6-global-accounting]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.6-global-accounting
      - name: Create managed WireGuard fixture before binding
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/hive-global-accounting.yml')
          s=p.read_text()
          old="""          sudo /opt/manager/modules/products.sh --create PREMIUM 'CI Premium' 1 0 2 wireguard 1000 lifetime warn '*' '*' '*' 2>/dev/null || true\n          sudo /opt/manager/modules/connection_engine.sh --create syncacct '' 0 2 wireguard >/dev/null\n          sudo /opt/manager/modules/connection_engine.sh --bind syncacct wireguard syncacct >/dev/null\n"""
          new="""          sudo /opt/manager/modules/products.sh --create PREMIUM 'CI Premium' 1 0 2 wireguard 1000 lifetime warn '*' '*' '*' 2>/dev/null || true\n          sudo mkdir -p /etc/manager/wireguard/clients\n          printf 'client=syncacct\\n' | sudo tee /etc/manager/wireguard/clients/syncacct.meta >/dev/null\n          printf '[Interface]\\nPrivateKey=ci-placeholder\\n' | sudo tee /etc/manager/wireguard/clients/syncacct.conf >/dev/null\n          sudo chmod 600 /etc/manager/wireguard/clients/syncacct.meta /etc/manager/wireguard/clients/syncacct.conf\n          sudo /opt/manager/modules/connection_engine.sh --create syncacct '' 0 2 wireguard >/dev/null\n          sudo /opt/manager/modules/connection_engine.sh --bind syncacct wireguard syncacct >/dev/null\n"""
          if new not in s:
              if old not in s:
                  raise SystemExit('fixture anchor missing')
              p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit fixture fix
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/hive-global-accounting.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: create WireGuard fixture for accounting sync'
          git push origin HEAD:feature/0.8.6-global-accounting
