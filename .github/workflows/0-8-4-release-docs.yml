name: Validate MANAGER 0.8.9 Release Metadata

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify 0.8.9 version and release documentation
        shell: bash
        run: |
          set -euxo pipefail
          test "$(cat VERSION)" = "0.8.9"
          grep -q 'Versão atual: \*\*0.8.9\*\*' README.md
          grep -q '^## \[0.8.9\] - 2026-10-14$' CHANGELOG.md
          grep -q '^### 0\.8\.9 — rotação de chaves e anti-replay distribuído ✅$' docs/ROADMAP.md
          grep -q '^## 24\. Rotação de chaves — fundação 0\.8\.9$' docs/HIVE.md
          grep -q 'hive_key_rotation.sh' install.sh
          grep -q 'hive_wg_rotation.sh' install.sh
          grep -q '^name: Hive Key Rotation$' .github/workflows/hive-key-rotation.yml
          grep -q '^name: Hive WireGuard Key Rotation$' .github/workflows/hive-wg-key-rotation.yml
          grep -q '^name: Hive Distributed Anti-Replay and Fencing Final Gate$' .github/workflows/hive-security-final-gate.yml

      - name: Keep 0.8.10 outside the 0.8.9 release
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^### 0\.8\.10 — observabilidade distribuída$' docs/ROADMAP.md
          ! grep -q '^## \[0.8.10\]' CHANGELOG.md
          test "$(cat VERSION)" = "0.8.9"
