name: Validate MANAGER 0.8.4 Release Metadata

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify 0.8.4 version and release documentation
        shell: bash
        run: |
          set -euxo pipefail
          test "$(cat VERSION)" = "0.8.4"
          grep -q 'Versão atual: \*\*0.8.4\*\*' README.md
          grep -q '0.8.4.*autoridade global de leases' README.md
          grep -q '^## \[0.8.4\] - 2026-10-12$' CHANGELOG.md
          grep -q '^## 15\. Autoridade global de leases — 0\.8\.4$' docs/HIVE.md
          grep -q 'Accounting global continua fora da 0.8.4' docs/HIVE.md
          ! grep -q 'Accounting global continua fora da 0.8.3' docs/HIVE.md
          grep -q 'WireGuard.*reconcil' docs/HIVE.md
          grep -q 'global_accounting=0' docs/HIVE.md

      - name: Keep 0.8.5 outside the 0.8.4 release gate
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^## Próxima etapa — 0.8.5$' docs/HIVE.md
          grep -q '0.8.5.*VPN allocation / login global' CHANGELOG.md
