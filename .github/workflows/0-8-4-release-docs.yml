name: Validate MANAGER 0.8.7 Release Metadata

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify 0.8.7 version and release documentation
        shell: bash
        run: |
          set -euxo pipefail
          test "$(cat VERSION)" = "0.8.7"
          grep -q 'Versão atual: \*\*0.8.7\*\*' README.md
          grep -q '0.8.7.*resiliência operacional' README.md
          grep -q '^## \[0.8.7\] - 2026-10-12$' CHANGELOG.md
          grep -q '^### 0\.8\.7 — failover e resiliência operacional ✅$' docs/ROADMAP.md
          grep -q '^## 22\. Resiliência operacional — fundação 0\.8\.7$' docs/HIVE.md
          grep -q 'manager hive lease node probe' docs/HIVE.md
          grep -q 'node-authority-recovered' modules/hive_leases.sh
          grep -q 'node-authority-fenced' modules/hive_leases.sh

      - name: Keep 0.8.8 outside the 0.8.7 release
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^### 0\.8\.8 — comandos remotos controlados$' docs/ROADMAP.md
          ! grep -q '^## \[0.8.8\]' CHANGELOG.md
          test "$(cat VERSION)" = "0.8.7"
