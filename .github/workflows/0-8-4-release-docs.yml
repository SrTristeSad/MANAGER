name: Validate MANAGER 0.8.5 Release Metadata

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify 0.8.5 version and release documentation
        shell: bash
        run: |
          set -euxo pipefail
          test "$(cat VERSION)" = "0.8.5"
          grep -q 'Versão atual: \*\*0.8.5\*\*' README.md
          grep -q '0.8.5.*VPN allocation / login global' README.md
          grep -q '^## \[0.8.5\] - 2026-10-12$' CHANGELOG.md
          grep -q '^### 0\.8\.5 — VPN allocation / login global ✅$' docs/ROADMAP.md
          grep -q 'manager-hive-vpn-login-result-v1' docs/HIVE.md
          grep -q 'manager hive login create' docs/HIVE.md
          grep -q 'manager hive login result' docs/HIVE.md

      - name: Permit 0.8.6 development without releasing 0.8.6
        shell: bash
        run: |
          set -euxo pipefail
          grep -Eq '^### 0\.8\.6 — quotas e accounting globais( 🚧)?$' docs/ROADMAP.md
          ! grep -q '^## \[0.8.6\]' CHANGELOG.md
          test "$(cat VERSION)" = "0.8.5"
