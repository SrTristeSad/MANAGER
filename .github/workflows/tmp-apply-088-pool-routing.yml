name: Temporary Apply 0.8.8 Pool Routing

on:
  push:
    branches: [feature/0.8.8-pool-routing]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.8-pool-routing
      - name: Apply pool routing patch and validate
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/tmp_088_pool_routing.py
          bash -n modules/hive_remote.sh
          bash -n manager
          test "$(cat VERSION)" = 0.8.7
          grep -q 'pool_routing=1' modules/hive_remote.sh
          grep -q 'controller-call-pool' modules/hive_remote.sh
          grep -q 'controller-select-pool' modules/hive_remote.sh
          grep -q 'call-pool POOL PROTOCOL ACTION' manager
          grep -q 'Roteamento por pool implementado' docs/ROADMAP.md
          python3 - <<'PY'
          from pathlib import Path
          s=Path('modules/hive_remote.sh').read_text()
          body=s.split("<<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          compile(body,'hive_remote_embedded.py','exec')
          PY
          git diff --check
      - name: Commit pool routing
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/hive_remote.sh manager docs/HIVE.md docs/ROADMAP.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: route typed operations through Hive pools'
          git push origin HEAD:feature/0.8.8-pool-routing
