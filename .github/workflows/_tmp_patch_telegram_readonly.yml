name: TEMP patch Telegram readonly operations

on:
  push:
    branches:
      - feature/0.9.0-telegram-readonly-ops

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[readonly-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.9.0-telegram-readonly-ops
      - name: Patch Automation v2 and Telegram gateway
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('modules/automation_v2.sh')
          s = p.read_text()
          old = 'NODE_USAGE = os.path.join(MANAGER_HOME, "modules", "node_usage.sh")\n'
          new = old + 'READ_OPS = os.path.join(MANAGER_HOME, "modules", "automation_read_ops.sh")\n'
          assert old in s and 'READ_OPS = ' not in s
          s = s.replace(old, new, 1)

          old = 'ACTIONS = {"system.describe", "node.usage", "connection.preflight", "connection.create", "connection.status", "connection.revoke"}'
          new = 'ACTIONS = {"system.describe", "node.usage", "operations.identities", "operations.products", "operations.sessions", "operations.nodes", "operations.diagnostics", "connection.preflight", "connection.create", "connection.status", "connection.revoke"}'
          assert old in s
          s = s.replace(old, new, 1)

          old = 'READ_ACTIONS = {"system.describe", "node.usage", "connection.status"}'
          new = 'READ_ACTIONS = {"system.describe", "node.usage", "operations.identities", "operations.products", "operations.sessions", "operations.nodes", "operations.diagnostics", "connection.status"}'
          assert old in s
          s = s.replace(old, new, 1)

          old = '    if action_id == "node.usage": return role == "admin", normalized, "node-usage-admin-only"\n'
          new = old + '    if action_id.startswith("operations."):\n        return role == "admin", normalized, "operations-read-admin-only"\n'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    if action_id == "node.usage":
        if params: raise ValueError("node.usage não aceita parâmetros")
        return [NODE_USAGE, "--show"]
'''
          new = old + '''    if action_id in {"operations.identities", "operations.products", "operations.sessions", "operations.nodes", "operations.diagnostics"}:
        if params: raise ValueError("operações read-only não aceitam parâmetros")
        command = {
            "operations.identities": "--identities",
            "operations.products": "--products",
            "operations.sessions": "--sessions",
            "operations.nodes": "--nodes",
            "operations.diagnostics": "--diagnostics",
        }[action_id]
        return [READ_OPS, command]
'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('modules/telegram_gateway.sh')
          s = p.read_text()
          old = "  printf 'typed_actions=system.describe,node.usage,connection.preflight,connection.create,connection.status,connection.revoke\\n'\n"
          new = "  printf 'typed_actions=system.describe,node.usage,operations.identities,operations.products,operations.sessions,operations.nodes,operations.diagnostics,connection.preflight,connection.create,connection.status,connection.revoke\\n'\n"
          assert old in s
          s = s.replace(old, new, 1)

          old = '    "node.usage": (set(), set()),\n'
          new = old + '    "operations.identities": (set(), set()),\n    "operations.products": (set(), set()),\n    "operations.sessions": (set(), set()),\n    "operations.nodes": (set(), set()),\n    "operations.diagnostics": (set(), set()),\n'
          assert old in s and '"operations.identities"' not in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          chmod +x modules/automation_read_ops.sh
          bash -n modules/automation_read_ops.sh modules/automation_v2.sh modules/telegram_gateway.sh
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/automation_read_ops.sh modules/automation_v2.sh modules/telegram_gateway.sh
          git commit -m 'feat: expose admin read-only operational actions [readonly-patched]'
          git push origin HEAD:feature/0.9.0-telegram-readonly-ops
