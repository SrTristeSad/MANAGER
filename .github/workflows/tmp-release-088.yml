name: Temporary Apply 0.8.8 Release

on:
  push:
    branches: [release/0.8.8]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.8.8
      - name: Apply 0.8.8 release metadata
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/tmp_release_088.py
          test "$(cat VERSION)" = 0.8.8
          grep -q 'Versão atual: \*\*0.8.8\*\*' README.md
          grep -q '^## \[0.8.8\] - 2026-10-12$' CHANGELOG.md
          grep -q '^### 0\.8\.8 — comandos remotos controlados ✅$' docs/ROADMAP.md
          grep -q '^name: Validate MANAGER 0.8.8 Release Metadata$' .github/workflows/0-8-4-release-docs.yml
          ! grep -q '^## \[0.8.9\]' CHANGELOG.md
          git diff --check
      - name: Commit release files
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION README.md CHANGELOG.md docs/ROADMAP.md .github/workflows
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'release: prepare MANAGER 0.8.8'
          git push origin HEAD:release/0.8.8
