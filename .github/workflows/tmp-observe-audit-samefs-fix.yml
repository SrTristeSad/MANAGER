name: Temporary Fix 0.8.10 Audit SameFS Rotation

on:
  push:
    branches:
      - feature/0.8.10-audit-retention
    paths:
      - .github/workflows/tmp-observe-audit-samefs-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.10-audit-retention
          fetch-depth: 0
      - name: Keep audit archives on the audit filesystem
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('modules/hive_observability.sh')
          s=p.read_text()
          old='''AUDIT_ARCHIVE_ROOT = os.path.join(DATA_DIR, "audit-archive")\nSCHED_ARCHIVE_DIR = os.path.join(AUDIT_ARCHIVE_ROOT, "scheduler")\nLEASE_ARCHIVE_DIR = os.path.join(AUDIT_ARCHIVE_ROOT, "leases")'''
          new='''SCHED_ARCHIVE_DIR = os.environ.get("MANAGER_HIVE_SCHEDULER_AUDIT_ARCHIVE_DIR", SCHED_AUDIT + ".d")\nLEASE_ARCHIVE_DIR = os.environ.get("MANAGER_HIVE_LEASE_AUDIT_ARCHIVE_DIR", LEASE_AUDIT + ".d")'''
          if s.count(old) != 1: raise SystemExit('archive constants anchor mismatch')
          s=s.replace(old,new,1)
          old2='''    ensure_dir(DATA_DIR, 0o700)\n    ensure_dir(AUDIT_ARCHIVE_ROOT, 0o700)\n    ensure_dir(SCHED_ARCHIVE_DIR, 0o700)\n    ensure_dir(LEASE_ARCHIVE_DIR, 0o700)'''
          new2='''    ensure_dir(DATA_DIR, 0o700)\n    ensure_dir(SCHED_ARCHIVE_DIR, 0o700)\n    ensure_dir(LEASE_ARCHIVE_DIR, 0o700)'''
          if s.count(old2) != 1: raise SystemExit('init_dirs anchor mismatch')
          p.write_text(s.replace(old2,new2,1).rstrip()+"\n")
          PY
          bash -n modules/hive_observability.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('modules/hive_observability.sh').read_text()
          marker='python3 - "$@" <<\'PY\'\n'
          start=p.index(marker)+len(marker)
          end=p.rfind('\nPY')
          compile(p[start:end], 'embedded-hive-observability', 'exec')
          PY
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/hive_observability.sh
          git commit -m 'fix: keep Hive audit rotation on same filesystem'
          git push origin HEAD:feature/0.8.10-audit-retention
