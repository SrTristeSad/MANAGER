name: TEMP Patch Telegram Ops Read

on:
  push:
    branches:
      - feature/0.9.0-telegram-ops-read-api

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.9.0-telegram-ops-read-api
          fetch-depth: 0
      - name: Refine scoped views
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('modules/automation_ops_views.sh')
          s=p.read_text()
          old='''def identity_visible(identity_id, owner=""):\n    if role == "user":\n        return identity_id == subject\n    return owner_visible(owner)\n'''
          new='''def identity_visible(identity_id, owner=""):\n    if role == "user":\n        return identity_id == subject\n    if not owner_visible(owner):\n        return False\n    if role in {"reseller", "subreseller"}:\n        assignment = read_conf(assignment_dir / f"{identity_id}.conf")\n        product_id = assignment.get("product_id", "")\n        if product_id and not product_visible(product_id, identity_id):\n            return False\n    return True\n'''
          if old not in s:
              raise SystemExit('identity visibility anchor missing')
          s=s.replace(old,new,1)
          old2='''    route = run_ok(["sh", "-c", "ip -4 route show default | grep -q '^default'"])\n    dns = run_ok(["getent", "ahostsv4", "debian.org"], 8)\n'''
          new2='''    try:\n        route_proc = subprocess.run(["ip", "-4", "route", "show", "default"], stdin=subprocess.DEVNULL,\n                                    stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True, timeout=5, check=False)\n        route = 1 if route_proc.returncode == 0 and any(x.startswith("default") for x in route_proc.stdout.splitlines()) else 0\n    except Exception:\n        route = 0\n    dns = run_ok(["getent", "ahostsv4", "debian.org"], 8)\n'''
          if old2 not in s:
              raise SystemExit('diagnostics route anchor missing')
          p.write_text(s.replace(old2,new2,1))
          PY
          bash -n modules/automation_ops_views.sh
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/automation_ops_views.sh
          git commit -m 'fix: enforce product scope in operational identity views'
          git push origin HEAD:feature/0.9.0-telegram-ops-read-api
