name: TEMP Fix Ops User Products

on:
  push:
    branches:
      - feature/0.9.0-telegram-ops-read-api

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.9.0-telegram-ops-read-api
          fetch-depth: 0
      - name: Patch user product sentinel handling
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('modules/automation_ops_views.sh')
          s=p.read_text()
          old='''if products_scope != "*":\n    parts = products_scope.split(",")\n    if not parts or any(not PRODUCT_RE.fullmatch(x) for x in parts):\n        die("ops-products-scope-invalid", 64)\n'''
          new='''if role == "user":\n    if products_scope != "-":\n        die("ops-user-products-sentinel-invalid", 64)\nelif products_scope != "*":\n    parts = products_scope.split(",")\n    if not parts or any(not PRODUCT_RE.fullmatch(x) for x in parts):\n        die("ops-products-scope-invalid", 64)\n'''
          if old not in s:
              raise SystemExit('products scope validation anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          bash -n modules/automation_ops_views.sh
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/automation_ops_views.sh
          git commit -m 'fix: accept Automation v2 user product sentinel in ops views'
          git push origin HEAD:feature/0.9.0-telegram-ops-read-api
