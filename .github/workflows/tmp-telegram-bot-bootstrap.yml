name: Temporary Telegram Bot Bootstrap

on:
  push:
    branches: [feature/0.9.0-telegram-bot-long-polling]
    paths:
      - tmp_patch_telegram_bot.py
      - .github/workflows/tmp-telegram-bot-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.9.0-telegram-bot-long-polling
      - name: Apply integration patch
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/TELEGRAM — IDENTIDADE \/ AUTENTICAÇÃO \/ GATEWAY \/ RBAC/TELEGRAM — IDENTIDADE \/ AUTENTICAÇÃO \/ RBAC/' manager
          python3 tmp_patch_telegram_bot.py
          bash -n modules/telegram_bot.sh
          bash -n modules/telegram_gateway.sh
          bash -n manager
          bash -n install.sh
          bash -n uninstall.sh
          bash -n rollback.sh
          git diff --check
      - name: Commit product integration
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/telegram_bot.sh modules/telegram_gateway.sh manager install.sh uninstall.sh rollback.sh docs/TELEGRAM.md docs/ROADMAP.md
          git commit -m 'feat: integrate Telegram Bot long-polling ingress'
          git push origin HEAD:feature/0.9.0-telegram-bot-long-polling
