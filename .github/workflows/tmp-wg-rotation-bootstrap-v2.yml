name: Bootstrap Hive 0.8.9 WireGuard rotation v2

on:
  push:
    branches: [feature/0.8.9-wireguard-rotation]
    paths: [.github/workflows/tmp-wg-rotation-bootstrap-v2.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.9-wireguard-rotation
          fetch-depth: 0

      - name: Recover payloads and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, gzip
          src = Path('.github/workflows/tmp-wg-rotation-bootstrap.yml').read_text(encoding='utf-8')
          blocks = re.findall(r"<<'B64'\n(.*?)\nB64", src, flags=re.S)
          if len(blocks) != 2:
              raise SystemExit(f'expected 2 payloads, found {len(blocks)}')
          module = gzip.decompress(base64.b64decode(''.join(blocks[0].split())))
          patch = gzip.decompress(base64.b64decode(''.join(blocks[1].split())))
          Path('modules/hive_wg_rotation.sh').write_bytes(module)
          Path('/tmp/patch_wg_rotation.py').write_bytes(patch)
          PY
          chmod 0755 modules/hive_wg_rotation.sh
          python3 /tmp/patch_wg_rotation.py
          bash -n modules/hive_wg_rotation.sh
          bash -n manager
          bash -n install.sh
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/hive_wg_rotation.sh manager install.sh docs/ROADMAP.md docs/HIVE.md
          git commit -m 'feat: add staged WireGuard mesh key rotation'
          git push origin HEAD:feature/0.8.9-wireguard-rotation
