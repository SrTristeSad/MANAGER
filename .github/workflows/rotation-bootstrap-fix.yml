name: Fix Hive 0.8.9 bootstrap output

on:
  push:
    branches: [feature/0.8.9-key-rotation]
    paths: [.github/workflows/rotation-bootstrap-fix.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.9-key-rotation
          fetch-depth: 0

      - name: Reapply validated bootstrap without trailing blank line
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,re
          from pathlib import Path
          src=Path('.github/workflows/rotation-bootstrap.yml').read_text()
          blocks=re.findall(r"cat > /tmp/[^\n]+ <<'B64'\n\s*([A-Za-z0-9+/=]+)\n\s*B64", src)
          if len(blocks) != 2:
              raise SystemExit(f'expected 2 embedded payloads, got {len(blocks)}')
          Path('modules/hive_key_rotation.sh').write_bytes(gzip.decompress(base64.b64decode(blocks[0])))
          patch=gzip.decompress(base64.b64decode(blocks[1])).decode()
          patch=patch.replace("p.write_text(s.rstrip() + hive_append + \"\\n\")", "p.write_text(s.rstrip() + hive_append.rstrip() + \"\\n\")")
          ns={'__name__':'__main__'}
          exec(compile(patch,'rotation_patch.py','exec'),ns,ns)
          PY
          chmod 0755 modules/hive_key_rotation.sh
          bash -n modules/hive_key_rotation.sh
          bash -n manager
          bash -n install.sh
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/hive_key_rotation.sh manager install.sh docs/ROADMAP.md docs/HIVE.md
          git commit -m 'feat: add Hive Ed25519 key rotation contracts'
          git push origin HEAD:feature/0.8.9-key-rotation
