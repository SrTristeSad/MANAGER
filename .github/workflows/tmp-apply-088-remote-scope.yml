name: Temporary Apply 0.8.8 Remote Scope

on:
  push:
    branches: [feature/0.8.8-remote-rbac-scopes]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.8-remote-rbac-scopes
      - name: Apply patch and validate structure
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/tmp_088_remote_scope.py
          bash -n modules/automation_principals.sh
          bash -n modules/automation_v2.sh
          bash -n manager
          test "$(cat VERSION)" = 0.8.7
          grep -q 'remote_scoped_rbac=1' modules/automation_v2.sh
          grep -q 'action-out-of-scope' modules/automation_v2.sh
          grep -q -- '--set-scope' modules/automation_principals.sh
          grep -q 'Ainda pendente para fechar 0.8.8' docs/ROADMAP.md
          git diff --check
      - name: Commit product patch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/automation_principals.sh modules/automation_v2.sh manager docs/AUTOMATION_V2.md docs/ROADMAP.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: scope remote automation by node pool and action'
          git push origin HEAD:feature/0.8.8-remote-rbac-scopes
