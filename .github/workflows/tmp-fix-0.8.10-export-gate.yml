name: Temporary Fix 0.8.10 Export Gate

on:
  push:
    branches:
      - feature/0.8.10-structured-export

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/0.8.10-structured-export
      - name: Fix exact forbidden-field validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/hive-observability-export.yml')
          text=p.read_text()
          old="""          forbidden=[
            '203.0.113.200','must-not-leak','private_key','password','token','secret','unknown',
            '/tmp/hive-export-logs','/var/log/manager','/var/lib/manager'
          ]
          for marker in forbidden:
              assert marker not in raw, marker
          x=json.loads(raw)
"""
          new="""          forbidden_values=[
            '203.0.113.200','must-not-leak',
            '/tmp/hive-export-logs','/var/log/manager','/var/lib/manager'
          ]
          for marker in forbidden_values:
              assert marker not in raw, marker
          x=json.loads(raw)
          forbidden_keys={'private_key','password','token','secret','unknown','signature','nonce'}
          def reject_forbidden_keys(value):
              if isinstance(value, dict):
                  assert not (set(value) & forbidden_keys), set(value) & forbidden_keys
                  for child in value.values():
                      reject_forbidden_keys(child)
              elif isinstance(value, list):
                  for child in value:
                      reject_forbidden_keys(child)
          reject_forbidden_keys(x['summary'])
          reject_forbidden_keys(x['streams'])
"""
          if text.count(old) != 1:
              raise SystemExit('expected leakage-test anchor exactly once')
          p.write_text(text.replace(old,new,1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-fix-0.8.10-export-gate.yml
          git add .github/workflows/hive-observability-export.yml
          git commit -m 'test: validate forbidden export fields exactly'
          git push origin HEAD:feature/0.8.10-structured-export
